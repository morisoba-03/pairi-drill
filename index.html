<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3a2c">
<meta name="description" content="雀卓の中央に置く点数管理と、点数計算・待ち・読み・何切るの練習ドリル">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>牌理ドリル</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@700;900&family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
:root{
  color-scheme: dark;
  --felt:#0f4a39; --felt2:#0b3a2c; --deep:#06231a; --panel:rgba(3,24,17,.55);
  --line:rgba(236,228,205,.16); --ivory:#efe7d2; --ivory2:#d8cdb0; --tileback:#c08a2e;
  --ink:#142520; --text:#eef2ea; --muted:#9dbfb1; --gold:#e7b54c; --red:#d9432f; --orange:#e98a3c;
  --good:#9fe0a4; --bad:#ff8f7f;
  --num:"Barlow Condensed","Arial Narrow",sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --min:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%;background:var(--deep)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;color:var(--text);font-family:var(--jp);
  background:radial-gradient(ellipse at 50% 45%,var(--felt) 0%,var(--felt2) 65%,var(--deep) 100%);
  padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:10px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%}
#table{position:absolute;inset:0}
#drill{position:fixed;inset:0;z-index:40}

/* ---- seats ---- */
.seat{position:absolute}
.seat[data-pos="0"]{left:0;right:0;bottom:0;height:var(--band)}
.seat[data-pos="2"]{left:0;right:0;top:0;height:var(--band)}
.seat[data-pos="1"]{right:0;top:var(--band);width:var(--side);height:var(--mid)}
.seat[data-pos="3"]{left:0;top:var(--band);width:var(--side);height:var(--mid)}
.face{position:absolute;left:50%;top:50%;width:calc(100% - 8px);height:calc(100% - 8px);
  transform:translate(-50%,-50%);container-type:size;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 10px}
.seat[data-pos="2"] .face{transform:translate(-50%,-50%) rotate(180deg)}
.seat[data-pos="1"] .face{width:calc(var(--mid) - 8px);height:calc(var(--side) - 8px);transform:translate(-50%,-50%) rotate(-90deg)}
.seat[data-pos="3"] .face{width:calc(var(--mid) - 8px);height:calc(var(--side) - 8px);transform:translate(-50%,-50%) rotate(90deg)}
.face.dealer{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 28px rgba(231,181,76,.18)}
.face.active{border-color:var(--ivory);box-shadow:inset 0 0 0 1px var(--ivory),0 0 30px rgba(239,231,210,.2)}
.face.empty{display:flex;justify-content:center;border-style:dashed;background:transparent;color:var(--muted)}
.face.empty span{font-size:max(11px,14cqh);white-space:nowrap}
.tile{position:relative;height:60cqh;aspect-ratio:3/4;display:grid;place-items:center;border-radius:9cqh;
  background:linear-gradient(180deg,var(--ivory),var(--ivory2));color:var(--ink);
  font-family:var(--min);font-weight:900;font-size:36cqh;line-height:1;box-shadow:0 4cqh 0 var(--tileback)}
.tile.is-oya{color:var(--red)}
.tile .oya{position:absolute;top:-12cqh;right:-14cqh;background:var(--gold);color:var(--ink);
  font-family:var(--jp);font-weight:900;font-size:13cqh;padding:2cqh 5cqh;border-radius:99px;line-height:1.2}
.mid{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1cqh}
.nm-row{display:flex;align-items:center;gap:2cqw;font-size:14cqh;color:var(--muted);min-width:0}
.nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:700}
.nr{margin-left:auto;flex:none}
.bdgs{display:flex;gap:4px;min-width:0;overflow:hidden}
.bdg{flex:none;border-radius:99px;padding:0 4cqh;font-size:max(10px,10cqh);font-weight:900;white-space:nowrap;line-height:1.35}
.bdg.y{background:var(--orange);color:var(--ink)}
.bdg.c{background:rgba(239,231,210,.14);color:var(--ivory);font-family:var(--num);font-weight:600}
.diff{font-family:var(--num);font-weight:600;font-size:17cqh;white-space:nowrap}
.diff.p{color:var(--good)} .diff.m{color:var(--bad)} .diff.b{color:var(--gold)}
.tobi,.rflag{background:var(--red);color:#fff;border-radius:99px;padding:0 5cqh;font-size:12cqh;font-weight:900;white-space:nowrap}
.score{background:none;border:0;padding:0;text-align:left;font-family:var(--num);font-weight:600;
  font-size:min(44cqh,14cqw);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.score.neg{color:var(--bad)}

/* seat action buttons: stacked on the top/bottom faces, a row on the long side faces */
.btns{display:grid;grid-auto-flow:row;gap:3cqh;align-content:center}
.fb{height:27cqh;min-width:24cqw;border-radius:9px;border:1.5px solid var(--line);background:rgba(239,231,210,.06);
  font-weight:700;font-size:max(12px,12cqh);display:flex;align-items:center;justify-content:center;gap:2cqw;padding:0 2cqw;line-height:1.1}
.fb .stick{width:5cqw;height:4cqh;min-height:5px}
.fb.win{background:var(--ivory);color:var(--ink);border-color:transparent;font-weight:900}
.fb.rch.on,.fb.on{background:var(--red);border-color:var(--red);color:#fff}
.tgt{height:70cqh;min-width:28cqw;border-radius:12px;border:0;background:var(--gold);color:var(--ink);font-weight:900;
  font-size:max(13px,15cqh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;padding:0 3cqw;line-height:1.1}
.tgt small{font-size:max(10px,10cqh);font-weight:700;opacity:.8}
.tgt.red{background:var(--red);color:#fff}
.tgt.off{background:rgba(239,231,210,.08);color:var(--muted);border:1.5px dashed var(--line)}
.tgt.dim{opacity:.45}
.btns.dr .tgt{height:52cqh}
.pad{min-width:0;display:flex;flex-direction:column;gap:3cqh}
.amt-l{display:flex;align-items:baseline;gap:2cqw;font-size:max(11px,12cqh);color:var(--muted);white-space:nowrap}
.amt-l b{font-family:var(--num);font-size:24cqh;line-height:1;color:var(--text);font-weight:700}
.unit{border:1px solid var(--line);background:rgba(239,231,210,.1);border-radius:99px;padding:0 3cqw;font-size:max(11px,11cqh);font-weight:700}
.pc{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqh}
.pc button{height:19cqh;border-radius:7px;border:1px solid var(--line);background:rgba(239,231,210,.08);
  font-family:var(--num);font-weight:600;font-size:max(12px,13cqh);padding:0}
@container (min-aspect-ratio: 7/2){
  .btns{grid-auto-flow:column;gap:2cqw}
  .fb{height:62cqh;min-width:0;aspect-ratio:1/1;flex-direction:column;gap:6cqh;font-size:max(12px,13cqh);padding:0}
  .fb .stick{width:60%;height:6cqh}
  .btns.dr .tgt{height:70cqh}
  .btns.dr .fb{aspect-ratio:auto;padding:0 3cqw}
  .pad{flex-direction:row;align-items:center;gap:3cqw}
  .amt-l{flex-direction:column;align-items:flex-start;gap:1cqh}
  .amt-l b{font-size:32cqh}
  .pc{flex:1;grid-template-columns:repeat(5,1fr)}
  .pad.chipmode .pc{grid-template-columns:repeat(3,1fr)}
  .pc button{height:36cqh}
}
.delta{position:absolute;left:50%;top:-4cqh;transform:translateX(-50%);font-family:var(--num);font-weight:700;
  font-size:26cqh;line-height:1.1;padding:0 5cqh;border-radius:8px;background:var(--deep);border:1px solid var(--line);
  animation:pop 3.4s ease forwards;pointer-events:none;white-space:nowrap}
.delta.p{color:var(--good)} .delta.m{color:var(--bad)}
@keyframes pop{0%{opacity:0;margin-top:10cqh}10%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0}}

/* tenbou */
.stick{display:inline-block;position:relative;width:30px;height:7px;border-radius:4px;background:var(--ivory);
  box-shadow:0 1px 0 rgba(0,0,0,.35);vertical-align:middle;flex:none}
.stick.s1000::after{content:"";position:absolute;left:50%;top:50%;height:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--red)}
.stick.s100::before,.stick.s100::after{content:"";position:absolute;top:1.5px;width:6px;height:4px;
  background:radial-gradient(circle,#1d1d1d 0 .75px,transparent 1.05px) 0 0/2px 2px}
.stick.s100::before{left:3px} .stick.s100::after{right:3px}

/* ---- center ---- */
.center{position:absolute;left:var(--side);right:var(--side);top:var(--band);bottom:var(--band);
  padding:6px;container-type:size;display:flex;flex-direction:column;justify-content:center;gap:10px}
.round{text-align:center;display:flex;flex-direction:column;align-items:center;gap:min(1.2cqh,6px)}
.rw{font-family:var(--min);font-weight:900;font-size:min(21cqw,8.5cqh);letter-spacing:.06em;line-height:1.1}
.meta{display:flex;flex-direction:column;gap:3px;font-size:min(8.5cqw,3.4cqh);color:var(--muted);align-items:flex-start}
.meta span{display:flex;align-items:center;gap:6px}
.meta b{color:var(--text);font-family:var(--num);font-size:1.25em;font-weight:600}
.tag{border:0;border-radius:99px;padding:2px 10px;font-size:min(7.5cqw,3cqh);font-weight:900;background:rgba(239,231,210,.12);color:var(--ivory)}
.tag.gold{background:var(--gold);color:var(--ink)}
.dmini{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;min-height:min(20cqw,8.5cqh);
  border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:min(8cqw,3.4cqh)}
.drow{display:flex;align-items:center;gap:7px}
.dmini .die{width:min(16cqw,6.5cqh)}
.dmini.rolling .die{animation:shake .12s linear infinite}
.dmini b{font-family:var(--num);font-size:min(14cqw,6cqh);color:var(--text);font-weight:600}
.arrow{display:inline-block;color:var(--gold);font-size:min(12cqw,5cqh);line-height:1}
.dtxt{font-size:min(7.5cqw,3.1cqh);color:var(--text)}
.dtxt em{font-style:normal;color:var(--gold);font-weight:900}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{min-height:min(21cqw,8.5cqh);border-radius:12px;border:1px solid var(--line);background:rgba(239,231,210,.07);
  font-weight:700;font-size:min(8.5cqw,3.6cqh);padding:2px}
.act.wide{grid-column:1/-1}
.act.primary{background:var(--ivory);color:var(--ink);border-color:transparent;font-weight:900}
.act.on{background:var(--red);border-color:var(--red);color:#fff}
.undo{background:none;border:0;color:var(--muted);font-size:min(7.5cqw,3.2cqh);padding:4px}
.undo:disabled{opacity:.3}
.hist-row{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.hist-row .undo{padding:6px 0;white-space:nowrap}
.chint{text-align:center;font-size:min(7cqw,3cqh);color:var(--muted);line-height:1.5}
.mode-box{border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.25);padding:10px 8px;text-align:center;
  font-size:min(7.5cqw,3.2cqh);line-height:1.55;color:var(--muted)}
.mode-box b{color:var(--text);display:block;font-size:1.25em}
.mini-dl{display:grid;gap:3px;font-size:min(7.5cqw,3.2cqh)}
.mini-dl div{display:flex;justify-content:space-between;gap:6px}
.mini-dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.mini-dl b{font-family:var(--num);font-size:1.3em;font-weight:600}
.p{color:var(--good)} .m{color:var(--bad)}
.die{display:block;aspect-ratio:1;height:auto;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
@keyframes shake{0%{transform:rotate(-10deg)}50%{transform:rotate(10deg) translateY(-3px)}100%{transform:rotate(-10deg)}}

/* ---- sheets ---- */
.sheet{position:absolute;left:50%;top:50%;z-index:10;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(180deg,#0a3327,var(--deep));display:flex;flex-direction:column;padding:12px;gap:10px;
  animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh-head h2{margin:0;font-size:18px;font-weight:900;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1}
.sh-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1.3dvh,12px);overflow:auto;container-type:size}
.sec{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.08em;font-weight:700}
.chips{display:grid;gap:6px}
.chip{min-height:clamp(34px,5.2dvh,46px);border-radius:10px;border:1px solid var(--line);background:rgba(239,231,210,.06);
  font-weight:700;font-size:15px;padding:2px 4px;line-height:1.15;min-width:0;overflow:hidden}
.chip small{display:block;font-size:10.5px;font-weight:500;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.chip.on.y{background:var(--orange);border-color:var(--orange)}
.chip:disabled{opacity:.25;cursor:default}
.chip.num{font-family:var(--num);font-size:19px;font-weight:600}
.preview{border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pv-hand{color:var(--muted);font-size:13px}
.pv-big{font-family:var(--num);font-weight:700;font-size:26px;line-height:1}
.pv-big em{font-style:normal;font-family:var(--jp);font-size:14px;color:var(--gold);margin-left:6px;font-weight:900}
.dl{display:grid;gap:4px}
.dl div{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);min-width:0}
.dl div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dl b{font-family:var(--num);font-size:18px;font-weight:600;color:var(--text)}
.dl b.p{color:var(--good)} .dl b.m{color:var(--bad)}
.hint{color:var(--muted);font-size:13px}
.big{min-height:50px;border-radius:12px;border:0;background:var(--gold);color:var(--ink);font-weight:900;font-size:17px;flex:none}
.big:disabled{opacity:.3;cursor:default}
.big.sub{background:rgba(239,231,210,.1);color:var(--text);border:1px solid var(--line)}
.big.warn{background:var(--red);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inp{width:100%;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--text);border-radius:9px;
  padding:8px 9px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.inp.num{font-family:var(--num);font-size:18px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.stp{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stp .v{text-align:center;font-family:var(--min);font-weight:900;font-size:22px}
.stp .v small{display:block;font-family:var(--jp);font-size:11px;color:var(--muted);font-weight:500}
.stp button{height:46px;border-radius:10px;border:1px solid var(--line);background:rgba(239,231,210,.06);font-size:20px}
.mstp{display:grid;grid-template-columns:40px 1fr 40px;gap:4px;align-items:center;text-align:center;font-size:13px;line-height:1.2}
.mstp button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(239,231,210,.06);font-size:18px}
.mstp b{font-family:var(--num);font-size:20px}
.mstp small{display:block;font-size:10px;color:var(--muted)}
.opts{display:grid;gap:6px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-grid .big{font-size:15px}
.rules{font-size:12px;color:var(--muted);line-height:1.6}
.tabs{display:grid;gap:4px;padding:3px;border-radius:12px;background:rgba(0,0,0,.3);flex:none}
.tabs button{min-height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:0 4px}
.tabs button.on{background:var(--ivory);color:var(--ink)}
.tabs button.edit{color:var(--gold)}
.tblwrap{flex:1;min-height:90px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.tblwrap.fit{flex:none;min-height:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#0a3327;font-size:12px;color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;max-width:80px}
th:first-child,td:first-child{text-align:left;padding-left:10px;color:var(--muted);font-size:12px}
td{font-family:var(--num);font-size:18px;font-weight:600}
table.sm td{font-size:16px} table.sm td.net{font-size:18px}
td.nmc{font-family:var(--jp);font-size:13px;color:var(--text);font-weight:700;max-width:70px;overflow:hidden;text-overflow:ellipsis}
td small{display:block;font-family:var(--jp);font-size:10px;color:var(--muted);font-weight:500}
td.net{font-size:20px}
tfoot td{border-top:2px solid var(--line);border-bottom:0;font-size:20px;position:sticky;bottom:0;background:#08291f}
.xfer{display:flex;flex-direction:column;gap:4px}
.xfer div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 10px;border-radius:9px;background:rgba(0,0,0,.25);font-size:14px}
.xfer b{font-family:var(--num);font-size:20px;font-weight:700;color:var(--gold)}
.oya-map{position:relative;flex:1;min-height:200px}
.oya-map .chip{position:absolute;width:38%;min-height:64px;font-size:16px}
.oya-map .chip[data-p="0"]{left:31%;bottom:0}
.oya-map .chip[data-p="1"]{right:0;top:50%;transform:translateY(-50%)}
.oya-map .chip[data-p="2"]{left:31%;top:0}
.oya-map .chip[data-p="3"]{left:0;top:50%;transform:translateY(-50%)}
.oya-map .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--min);font-weight:900;font-size:15px;color:var(--muted)}
.end-reason{font-family:var(--min);font-weight:900;font-size:22px;text-align:center;padding:10px 0;text-wrap:balance}
/* win picker: two columns when the sheet is turned sideways toward a side seat */
.wp{display:flex;flex-direction:column;gap:clamp(6px,1.3dvh,12px);min-height:100%}
.wp-l,.wp-r{display:contents}
.wp .s-from{order:0} .wp .s-han{order:1} .wp .s-fu{order:2} .wp .opts{order:3} .wp .preview{order:4}
.wp .ok{order:5;margin-top:auto}
@container (orientation: landscape){
  .wp{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;height:100%}
  .wp-l,.wp-r{display:flex;flex-direction:column;gap:7px;min-height:0}
  .wp .chip{min-height:34px}
  .wp .preview{padding:7px 10px;gap:4px}
}

<script>
// 牌理ドリル: runs inside a shadow root so its styles and ids stay separate from the table app
function initDrill(root,shared){
// ===== 牌理ロジック =====
const HONOR=['東','南','西','北','白','發','中'];
const SUITN=['萬','筒','索'];
const WAITNAME={ryanmen:'両面',kanchan:'嵌張',penchan:'辺張',tanki:'単騎',shanpon:'シャンポン'};
const isHonor=t=>t>=27, isTerm=t=>t<27&&(t%9===0||t%9===8), isYao=t=>isHonor(t)||isTerm(t);
const isDragon=t=>t>=31, isWind=t=>t>=27&&t<=30;
const ri=n=>Math.floor(Math.random()*n);
const pick=a=>a[ri(a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function tLabel(t){return t>=27?HONOR[t-27]:(t%9+1)+SUITN[Math.floor(t/9)];}
function zeros(){return Array(34).fill(0);}
function toArr(c){const a=[];c.forEach((n,t)=>{for(let i=0;i<n;i++)a.push(t);});return a;}
function sum(c){return c.reduce((a,b)=>a+b,0);}

// ---- 面子分解 ----
function groupsRec(c,i,acc,cb){
  while(i<34&&!c[i])i++;
  if(i===34){cb(acc.slice());return;}
  if(c[i]>=3){c[i]-=3;acc.push({k:'kou',t:i});groupsRec(c,i,acc,cb);acc.pop();c[i]+=3;}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;acc.push({k:'shun',t:i});groupsRec(c,i,acc,cb);acc.pop();c[i]++;c[i+1]++;c[i+2]++;}
}
function decompose(c){
  const res=[],seen=new Set();
  for(let p=0;p<34;p++){
    if(c[p]<2)continue;
    c[p]-=2;
    groupsRec(c,0,[],g=>{
      const key=p+'|'+g.map(x=>x.k[0]+x.t).sort().join(',');
      if(!seen.has(key)){seen.add(key);res.push({pair:p,groups:g});}
    });
    c[p]+=2;
  }
  return res;
}
function isChiitoi(c){return sum(c)===14&&c.filter(n=>n===2).length===7;}
function isAgari(c){return isChiitoi(c)||decompose(c).length>0;}
function waitsOf(c13){
  const w=[];
  for(let t=0;t<34;t++){if(c13[t]>=4)continue;c13[t]++;if(isAgari(c13))w.push(t);c13[t]--;}
  return w;
}
function waitShapes(c13,w){
  const c=c13.slice();c[w]++;
  const shapes=new Set();let example=null;
  for(const d of decompose(c)){
    let found=false;
    if(d.pair===w){shapes.add('tanki');found=true;}
    for(const g of d.groups){
      if(g.k==='kou'&&g.t===w){shapes.add('shanpon');found=true;}
      if(g.k==='shun'&&w>=g.t&&w<=g.t+2){
        const p=w-g.t;
        if(p===1)shapes.add('kanchan');
        else if((p===2&&g.t%9===0)||(p===0&&g.t%9===6))shapes.add('penchan');
        else shapes.add('ryanmen');
        found=true;
      }
    }
    if(found&&!example)example=d;
  }
  let chiitoi=false;
  if(isChiitoi(c)){chiitoi=true;shapes.add('tanki');}
  return {shapes:[...shapes],example,chiitoi};
}

// ---- 向聴数（一般形）----
function shanten(c){
  let best=8,hp=0;
  function rec(i,m,t){
    while(i<34&&!c[i])i++;
    if(i>=34){const tt=Math.min(t,4-m);const s=8-2*m-tt-hp;if(s<best)best=s;return;}
    if(c[i]>=3){c[i]-=3;rec(i,m+1,t);c[i]+=3;}
    if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;rec(i,m+1,t);c[i]++;c[i+1]++;c[i+2]++;}
    if(m+t<4){
      if(c[i]>=2){c[i]-=2;rec(i,m,t+1);c[i]+=2;}
      if(i<27&&i%9<=7&&c[i+1]){c[i]--;c[i+1]--;rec(i,m,t+1);c[i]++;c[i+1]++;}
      if(i<27&&i%9<=6&&c[i+2]){c[i]--;c[i+2]--;rec(i,m,t+1);c[i]++;c[i+2]++;}
    }
    const s=c[i];c[i]=0;rec(i+1,m,t);c[i]=s;
  }
  hp=0;rec(0,0,0);
  for(let p=0;p<34;p++){if(c[p]>=2){c[p]-=2;hp=1;rec(0,0,0);c[p]+=2;}}
  return best;
}
function analyzeDiscards(c14){
  const c=c14.slice(),out=[];
  for(let t=0;t<34;t++){
    if(!c[t])continue;
    c[t]--;
    const s=shanten(c);const uke=[];let cnt=0;
    for(let u=0;u<34;u++){
      const rest=4-c14[u];if(rest<=0)continue;
      c[u]++;if(shanten(c)<s){uke.push(u);cnt+=rest;}c[u]--;
    }
    c[t]++;
    out.push({t,s,uke,cnt});
  }
  out.sort((a,b)=>a.s-b.s||b.cnt-a.cnt||a.t-b.t);
  return out;
}

// ---- 点数計算 ----
function basePoints(han,fu,rules){
  if(han>=13)return{base:8000,limit:'数え役満'};
  if(han>=11)return{base:6000,limit:'三倍満'};
  if(han>=8)return{base:4000,limit:'倍満'};
  if(han>=6)return{base:3000,limit:'跳満'};
  if(han>=5)return{base:2000,limit:'満貫'};
  const raw=fu*Math.pow(2,han+2);
  if(raw>=2000)return{base:2000,limit:'満貫',raw};
  if(rules.kiriage&&((han===4&&fu===30)||(han===3&&fu===60)))return{base:2000,limit:'満貫（切り上げ）',raw};
  return{base:raw,limit:'',raw};
}
const r100=x=>Math.ceil(x/100)*100;
function payText(han,fu,dealer,tsumo,rules){
  const b=basePoints(han,fu,rules);
  if(!tsumo){const v=r100(b.base*(dealer?6:4));return{...b,text:String(v),total:v};}
  if(dealer){const e=r100(b.base*2);return{...b,text:e+'オール',total:e*3};}
  const ko=r100(b.base),oya=r100(b.base*2);
  return{...b,text:ko+'・'+oya,total:ko*2+oya};
}
function groupHasYao(g){return g.k==='shun'?(g.t%9===0||g.t%9===6):isYao(g.t);}
function groupTiles(g){return g.k==='shun'?[g.t,g.t+1,g.t+2]:(g.k==='kan'?[g.t,g.t,g.t,g.t]:[g.t,g.t,g.t]);}

function evalStd(d,pos,ctx){
  const {melds,win,tsumo,riichi,bakaze,jikaze,dora,rules}=ctx;
  const menzen=melds.every(m=>m.k==='ankan');
  const conc=d.groups.map(g=>({k:g.k,t:g.t,open:false}));
  let wait;
  if(pos.kind==='pair')wait='tanki';
  else{
    const g=conc[pos.i];
    if(g.k==='kou'){wait='shanpon';if(!tsumo){g.open=true;g.ronKou=true;}}
    else{const p=win-g.t;wait=p===1?'kanchan':((p===2&&g.t%9===0)||(p===0&&g.t%9===6))?'penchan':'ryanmen';}
    g.win=true;
  }
  const mg=melds.map(m=>({k:m.k==='chi'?'shun':m.k==='pon'?'kou':'kan',t:m.t,open:m.k!=='ankan',meld:m.k}));
  const all=conc.concat(mg);
  const pair=d.pair;
  const shuns=all.filter(g=>g.k==='shun'),kous=all.filter(g=>g.k!=='shun');
  const tiles=[pair,pair];all.forEach(g=>tiles.push(...groupTiles(g)));
  const Y=[];const add=(n,h)=>Y.push({name:n,han:h});
  // 役満チェック（出題から除外するため）
  const ank=kous.filter(g=>!g.open).length;
  const dragonK=kous.filter(g=>isDragon(g.t)).length;
  const windK=kous.filter(g=>isWind(g.t)).length;
  let yakuman=false;
  if(ank===4||dragonK===3||tiles.every(isHonor)||tiles.every(isTerm)||windK===4||(windK===3&&isWind(pair))||kous.filter(g=>g.k==='kan').length===4)yakuman=true;
  if(menzen){const suits=new Set(tiles.filter(t=>!isHonor(t)).map(t=>Math.floor(t/9)));
    if(suits.size===1&&!tiles.some(isHonor)){const s=[...suits][0]*9;const cc=zeros();tiles.forEach(t=>cc[t]++);
      const need=[3,1,1,1,1,1,1,1,3];if(need.every((n,k)=>cc[s+k]>=n))yakuman=true;}}
  if(yakuman)return{yakuman:true};

  const yakuhaiPair=isDragon(pair)||pair===bakaze||pair===jikaze;
  if(riichi)add('立直',1);
  if(menzen&&tsumo)add('門前清自摸和',1);
  let pinfu=false;
  if(menzen&&melds.length===0&&shuns.length===4&&!yakuhaiPair&&wait==='ryanmen'&&(!tsumo||rules.tsumoPinfu)){pinfu=true;add('平和',1);}
  if(tiles.every(t=>!isYao(t))&&(menzen||rules.kuitan))add('断幺九',1);
  if(menzen){const m={};shuns.forEach(g=>m[g.t]=(m[g.t]||0)+1);let pc=0;Object.values(m).forEach(v=>pc+=Math.floor(v/2));
    if(pc===2)add('二盃口',3);else if(pc===1)add('一盃口',1);}
  kous.forEach(g=>{
    if(isDragon(g.t))add('役牌 '+HONOR[g.t-27],1);
    if(g.t===bakaze)add('場風 '+HONOR[g.t-27],1);
    if(g.t===jikaze)add('自風 '+HONOR[g.t-27],1);
  });
  for(let n=0;n<7;n++)if([0,9,18].every(s=>shuns.some(g=>g.t===s+n))){add('三色同順',menzen?2:1);break;}
  for(let s=0;s<3;s++)if([0,3,6].every(k=>shuns.some(g=>g.t===s*9+k))){add('一気通貫',menzen?2:1);break;}
  if(shuns.length>0&&all.every(groupHasYao)&&isYao(pair)){
    const hasH=tiles.some(isHonor);
    if(hasH)add('混全帯幺九',menzen?2:1);else add('純全帯幺九',menzen?3:2);
  }
  if(kous.length===4)add('対々和',2);
  if(ank===3)add('三暗刻',2);
  for(let n=0;n<9;n++)if([0,9,18].every(s=>kous.some(g=>g.t===s+n))){add('三色同刻',2);break;}
  if(kous.filter(g=>g.k==='kan').length===3)add('三槓子',2);
  if(dragonK===2&&isDragon(pair))add('小三元',2);
  if(shuns.length===0&&tiles.every(isYao))add('混老頭',2);
  const suits=new Set(tiles.filter(t=>!isHonor(t)).map(t=>Math.floor(t/9)));
  if(suits.size===1){if(tiles.some(isHonor))add('混一色',menzen?3:2);else add('清一色',menzen?6:5);}
  const yakuHan=Y.reduce((a,y)=>a+y.han,0);
  if(yakuHan===0)return{noYaku:true};

  // 符
  const F=[];let fu;
  if(pinfu){
    if(tsumo){F.push(['平和ツモは20符で固定',20]);fu=20;}
    else{F.push(['副底',20],['門前ロン',10]);fu=30;}
  }else{
    F.push(['副底',20]);
    if(menzen&&!tsumo)F.push(['門前ロン',10]);
    if(tsumo)F.push(['ツモ',2]);
    if(wait!=='ryanmen'&&wait!=='shanpon')F.push([WAITNAME[wait]+'待ち',2]);
    let pf=0;
    if(isDragon(pair))pf=2;
    else if(pair===bakaze&&pair===jikaze)pf=rules.renpu;
    else if(pair===bakaze||pair===jikaze)pf=2;
    if(pf)F.push(['雀頭 '+tLabel(pair)+(pair===bakaze&&pair===jikaze?'（連風牌）':'（役牌）'),pf]);
    all.filter(g=>g.k!=='shun').forEach(g=>{
      let v=isYao(g.t)?4:2;if(!g.open)v*=2;if(g.k==='kan')v*=4;
      const kind=g.k==='kan'?(g.open?'明槓':'暗槓'):(g.open?'明刻':'暗刻');
      F.push([kind+' '+tLabel(g.t)+(isYao(g.t)?'（幺九牌）':'（中張牌）')+(g.ronKou?' ※ロンで完成→明刻扱い':''),v]);
    });
    let raw=F.reduce((a,f)=>a+f[1],0);
    if(!menzen&&raw===20){F.push(['副露の平和形は30符に',10]);raw=30;}
    fu=Math.ceil(raw/10)*10;
  }
  const rawFu=F.reduce((a,f)=>a+f[1],0);
  const han=yakuHan+dora;
  const pay=payText(han,fu,ctx.dealer,tsumo,rules);
  return{yaku:Y,yakuHan,han,fu,rawFu,fuLines:F,pinfu,wait,pay,groups:all,pair,menzen};
}
function evalChiitoi(c,ctx){
  const {tsumo,riichi,dora,rules}=ctx;
  const tiles=toArr(c);const Y=[];const add=(n,h)=>Y.push({name:n,han:h});
  if(tiles.every(isHonor))return{yakuman:true};
  if(riichi)add('立直',1);
  if(tsumo)add('門前清自摸和',1);
  add('七対子',2);
  if(tiles.every(t=>!isYao(t)))add('断幺九',1);
  if(tiles.every(isYao))add('混老頭',2);
  const suits=new Set(tiles.filter(t=>!isHonor(t)).map(t=>Math.floor(t/9)));
  if(suits.size===1){if(tiles.some(isHonor))add('混一色',3);else add('清一色',6);}
  const yakuHan=Y.reduce((a,y)=>a+y.han,0);const han=yakuHan+dora;
  return{yaku:Y,yakuHan,han,fu:25,rawFu:25,fuLines:[['七対子は25符で固定',25]],chiitoi:true,wait:'tanki',
    pay:payText(han,25,ctx.dealer,tsumo,rules),pairs:[...new Set(tiles)],menzen:true};
}
function scoreHand(ctx){
  const {conc,melds,win}=ctx;
  const c=conc.slice();
  const cands=[];let yakuman=false,noYaku=false;
  for(const d of decompose(c)){
    const pos=[];
    if(d.pair===win)pos.push({kind:'pair'});
    d.groups.forEach((g,i)=>{if((g.k==='kou'&&g.t===win)||(g.k==='shun'&&win>=g.t&&win<=g.t+2))pos.push({kind:'g',i});});
    for(const p of pos){const r=evalStd(d,p,ctx);if(r.yakuman)yakuman=true;else if(r.noYaku)noYaku=true;else cands.push(r);}
  }

        const key=cand.filter(t=>['kabe','onechance','katasuji'].includes(infos[t].cat));
        if(!key.length)continue;

        if(!hot.length)continue;

        ds=hot.slice(0,2).concat(rest).slice(0,4);
        if(ds.length<4)continue;

      }
      const fac=[0,2,1.4,1.15][level];
      const cats={};ds.forEach(t=>cats[t]=infos[t].cat);
      const F=finalize(S,own,[w].concat(ds),inf=>ds.every(t=>inf[t].cat===cats[t])&&inf[w].cat===wi.cat&&inf[w].danger>=fac*Math.max(...ds.map(t=>inf[t].danger)));
      if(!F)continue;
      return{...sc,kind:'hit',own:F.own,win:w,cands:F.cands.sort((a,b)=>a-b),infos:F.infos,V:F.V,riichiT:S.riichiT,early:S.early};

function genSafe(level){
  for(let att=0;att<120;att++){
    const S=readSetup();if(!S)continue;const {sc,waitSet}=S;
    for(let fill=0;fill<40;fill++){
      const avail=zeros();sc.rest.forEach(t=>avail[t]++);
      const own=zeros();
      if(!fillOwn(S,own,avail,14,true))continue;
      const {V,infos}=evalOwn(S,own);
      const pool=Object.keys(infos).map(Number).filter(t=>infos[t].cat!=='genbutsu');
      const safeOK=t=>!waitSet.has(t);
      let ans=null,ds=null;
      if(level===1){
        const a=shuffle(pool.filter(t=>safeOK(t)&&['suji','nakasuji','jihai3'].includes(infos[t].cat)));
        if(!a.length)continue;ans=a[0];
        const d=shuffle(pool.filter(t=>t!==ans&&['musuji','katasuji','jihai'].includes(infos[t].cat)));
        const hitFirst=d.filter(t=>waitSet.has(t)).concat(d.filter(t=>!waitSet.has(t)));
        ds=hitFirst.slice(0,3);if(ds.length<3)continue;
        if(infos[ans].danger>0.5*Math.min(...ds.map(t=>infos[t].danger)))continue;
      }else if(level===2){
        let a=shuffle(pool.filter(t=>safeOK(t)&&['kabe','onechance','nakasuji','suji','jihai2','jihai3'].includes(infos[t].cat)));
        const pref=a.filter(t=>['kabe','onechance','nakasuji'].includes(infos[t].cat));
        if(pref.length&&Math.random()<0.75)a=pref;
        if(!a.length)continue;ans=a[0];
        const d=shuffle(pool.filter(t=>t!==ans&&infos[t].danger>=infos[ans].danger*1.65));
        const hitFirst=d.filter(t=>waitSet.has(t)).concat(d.filter(t=>!waitSet.has(t)));
        ds=hitFirst.slice(0,4);if(ds.length<4)continue;
      }else{
        const a=shuffle(pool.filter(t=>safeOK(t)&&infos[t].danger>0));
        let found=false;
        for(const t of a){
          const d=pool.filter(u=>u!==t&&infos[u].danger>=infos[t].danger*1.25);
          const close=shuffle(d.filter(u=>infos[u].danger<=infos[t].danger*2.4));
          const trap=close.filter(u=>['suji','nakasuji','kabe','onechance','katasuji','jihai2'].includes(infos[u].cat));
          if(close.length<2||!trap.length)continue;
          const rest=shuffle(d.filter(u=>!close.includes(u)));
          ds=[trap[0]].concat(close.filter(u=>u!==trap[0]),rest).slice(0,4);
          if(ds.length<4)continue;
          ans=t;found=true;break;
        }
        if(!found)continue;
      }
      const fac=[0,2,1.65,1.25][level];
      const cats={};ds.concat([ans]).forEach(t=>cats[t]=infos[t].cat);
      const F=finalize(S,own,[ans].concat(ds),inf=>ds.concat([ans]).every(t=>inf[t].cat===cats[t])&&Math.min(...ds.map(t=>inf[t].danger))>=fac*inf[ans].danger&&inf[ans].danger<Math.min(...ds.map(t=>inf[t].danger)));
      if(!F)continue;
      return{...sc,kind:'safe',own:F.own,win:ans,cands:F.cands.sort((a,b)=>a-b),infos:F.infos,V:F.V,riichiT:S.riichiT,early:S.early};
    }
  }

}

    </div>
<!--CTRL-->
    <div class="steps" style="grid-template-columns:repeat(3,1fr)">${stepH}</div>
    <p class="hint">${Q.step==='h'?'役とドラを合計した翻数':Q.step==='f'?'符を計算して10符単位に切り上げた値':payHint}${lv===1?' ／ 初級は符を表示しています':''}</p>

  if(!d){

function checkScore(){

  record(Q.ok);Q.step=Q.h!==r.han?'h':(r.han<5&&Q.f!==r.fu)?'f':'p';drawScore();

function memoHTML(ctx,r){

  if(ctx.tsumo)tips.push(ctx.dealer?'親のツモは子3人が同じ額を払う「◯オール」。ロンの点数を3等分したくらい':'子のツモは「子の払い・親の払い」で、親は子の2倍払う');

    <div class="mbox"><b class="mt">符の目安</b><p>${ft.head}</p>${ft.lines.length?`<ul>${ft.lines.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${ft.tail?`<p>${ft.tail}</p>`:''}
      <p class="sub">よく出るのは30符と40符。門前ロンで幺九牌（1・9・字牌）の暗刻が1つあると、それだけで+8符になり40符になりやすい。</p></div>
    ${ladder?`<div class="mbox"><b class="mt">${r.han>=5?who+'の満貫以上':who+'・'+fuRow+'符の早見'}</b>${ladder}<p class="sub">${r.han>=5?'5翻以上は符に関係なく、この表の点数で決まります。':'この並びを丸ごと覚えておくと計算しなくて済みます。'}</p></div>`:''}
    <div class="mbox"><b class="mt">便利な覚え方</b><ul>${tips.map(t=>`<li>${t}</li>`).join('')}</ul></div></div>`;

function quickTable(dealer,tsumo){

function scoreBody(){
  const {ctx,r}=Q;

// ===== 渋川式 =====
// 符を後回しにして、アガリ方ごとの「表」を覚える方式。段階1〜4は表の暗記カード、5は符の段階、6は実戦形の総合問題
let course=LS.get('course','normal');if(!['normal','shibu'].includes(course))course='normal';
let shibu=Object.assign({stage:1,w:{},rec:{},cl:{}},LS.get('shibu',{}));
if(!(shibu.stage>=1&&shibu.stage<=6))shibu.stage=1;
const saveSb=()=>LS.set('shibu',shibu);
const SB_PAT={
  tsumo:{n:'ツモ',fu:30,ts:1,tbl:'30符'},menron:{n:'門前ロン',fu:40,ts:0,tbl:'40符'},nakiron:{n:'鳴いてロン',fu:30,ts:0,tbl:'30符'},
  pinT:{n:'平和ツモ',fu:20,ts:1,tbl:'20符'},pinR:{n:'平和ロン',fu:30,ts:0,tbl:'30符'},chiR:{n:'七対子ロン',fu:25,ts:0,tbl:'25符'},chiT:{n:'七対子ツモ',fu:25,ts:1,tbl:'25符'},
  mR:{n:'ロン',fu:30,ts:0},mT:{n:'ツモ',fu:30,ts:1}};
const SB_HANS={tsumo:[1,2,3,4],menron:[1,2,3,4],nakiron:[1,2,3,4],pinT:[2,3,4],pinR:[1,2,3,4],chiR:[2,3,4],chiT:[3,4],
  mR:[5,6,7,8,9,10,11,12,13],mT:[5,6,8,11,13]};
const SB_STAGES=[null,{n:'満貫以上',s:'満貫↑'},{n:'基本の3つの表',s:'3つの表'},{n:'平和・七対子',s:'平和七対'},{n:'親の点数',s:'親'},{n:'符で段階アップ',s:'符の段階'},{n:'総合（実戦形）',s:'総合'}];
const SB_LIM={5:'満貫',6:'跳満',8:'倍満',11:'三倍満',13:'役満'};
const sbVal=(p,h,d)=>payText(h,SB_PAT[p].fu,d,!!SB_PAT[p].ts,rules).text;
const sbFmt=t=>/オール/.test(t)?'a':/・/.test(t)?'t':'r';
const sbFam=p=>p[0]==='m'?['mR','mT']:['tsumo','menron','nakiron'].includes(p)?['tsumo','menron','nakiron']:['pinT','pinR','chiR','chiT'];
const sbFamName=p=>p[0]==='m'?'満貫以上':['tsumo','menron','nakiron'].includes(p)?'基本の3つ':'平和・七対子';
function sbCards(st){
  const mk=(ps,d)=>ps.flatMap(p=>SB_HANS[p].map(h=>({p,h,d})));
  let cs;
  if(st===1)cs=mk(['mR','mT'],false);
  else if(st===2)cs=mk(['tsumo','menron','nakiron'],false);
  else if(st===3)cs=mk(['pinT','pinR','chiR','chiT'],false);
  else cs=mk(['tsumo','menron','nakiron','pinT','pinR','chiR','chiT'],true).concat(mk(['mR','mT'],true).filter(c=>SB_LIM[c.h]));
  cs.forEach(c=>c.id=c.p+c.h+(c.d?'o':'k'));
  return cs;
}
function sbPickCard(st){
  const cs=sbCards(st),last=Q&&Q.card?Q.card.id:null;
  const ws=cs.map(c=>c.id===last?0:(shibu.w[c.id]||1));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<cs.length;i++){r-=ws[i];if(r<=0)return cs[i];}
  return cs[0];
}
// 4択：同じ翻の別の表・翻ずれ・親子の取り違えを優先して混ぜる
function sbChoices(ans,near,pool){
  const f=sbFmt(ans),seen=new Set([ans]),out=[];
  const take=a=>{for(const t of a){if(out.length>=3)break;if(t&&sbFmt(t)===f&&!seen.has(t)){seen.add(t);out.push(t);}}};
  take(shuffle(near.slice()));take(shuffle(pool.slice()));
  return out.concat([ans]).sort((a,b)=>payVal(a)-payVal(b));
}
function sbCardOpts(c){
  const ans=sbVal(c.p,c.h,c.d),near=[];
  sbFam(c.p).forEach(p=>{if(p!==c.p&&SB_HANS[p].includes(c.h))near.push(sbVal(p,c.h,c.d));});
  if(c.p[0]==='m'){
    // 満貫以上は隣の区分（跳満・倍満…）と取り違えやすい
    const L=[5,6,8,11,13],i=L.indexOf(c.h>=13?13:c.h>=11?11:c.h>=8?8:c.h>=6?6:5);
    [i-1,i+1,i-2,i+2].forEach(j=>{if(L[j])near.push(sbVal(c.p,L[j],c.d));});
  }else[-1,1].forEach(dh=>{if(SB_HANS[c.p].includes(c.h+dh))near.push(sbVal(c.p,c.h+dh,c.d));});
  near.push(sbVal(c.p,c.h,!c.d));
  const pool=sbCards(shibu.stage).map(x=>sbVal(x.p,x.h,x.d));
  return{ans,opts:sbChoices(ans,near,pool)};
}
function sbProgress(ok){
  const st=shibu.stage,a=(shibu.rec[st]=(shibu.rec[st]||[]).concat(ok?1:0).slice(-10));
  let msg='';
  if(!shibu.cl[st]&&a.length>=10&&a.reduce((x,y)=>x+y,0)>=8){shibu.cl[st]=1;msg=`<br><b>段階${st}クリア！</b>${st<6?' 次の段階に進めます':''}`;}
  saveSb();return msg;
}
function sbWeight(id,ok,slow){const w=shibu.w[id]||1;shibu.w[id]=!ok?Math.min(10,w+3):slow?w+.5:Math.max(1,w*.6);}
function courseSeg(){
  const a=shibu.rec[shibu.stage]||[];
  return `<div class="crs"><div class="seg" role="group" aria-label="コース"><button type="button" data-course="normal" aria-pressed="${course==='normal'}">通常</button><button type="button" data-course="shibu" aria-pressed="${course==='shibu'}">渋川式</button></div>`
    +(course==='shibu'?`<span class="sbname">段階${shibu.stage}：${SB_STAGES[shibu.stage].n}${a.length?`（直近 ${a.reduce((x,y)=>x+y,0)}/${a.length}）`:''}</span>`:'')+'</div>'
    +(course==='shibu'?`<div class="stg">${[1,2,3,4,5,6].map(i=>`<button type="button" data-stage="${i}" aria-pressed="${shibu.stage===i}">${shibu.cl[i]?'✓':i}<small>${SB_STAGES[i].s}</small></button>`).join('')}</div>`:'');
}
function bindCourse(){
  root.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{if(course===b.dataset.course)return;course=b.dataset.course;LS.set('course',course);next();});
  root.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{shibu.stage=+b.dataset.stage;saveSb();next();});
}
function sbTable(pats,d,hl){
  const man=pats[0][0]==='m',cols=man?[5,6,8,11,13]:[1,2,3,4];
  const colOf=h=>!man?h:h>=13?13:h>=11?11:h>=8?8:h>=6?6:5;
  const head=cols.map(h=>`<th class="num">${man?SB_LIM[h]:h+'翻'}</th>`).join('');
  const rows=pats.map(p=>`<tr><td>${SB_PAT[p].n}${SB_PAT[p].tbl?`<small class="sbf">${SB_PAT[p].tbl}</small>`:''}</td>${cols.map(h=>{
    const ok=man||SB_HANS[p].includes(h);if(!ok)return '<td class="num">—</td>';
    const v=sbVal(p,h,d),pt=payText(h,SB_PAT[p].fu,d,!!SB_PAT[p].ts,rules),lim=!man&&pt.limit?(/切り上げ/.test(pt.limit)?'切上満貫':pt.limit):'';
    let c='num';if(hl&&hl.p===p&&colOf(hl.h)===h)c+=' hi';else if(hl&&hl.mine===v)c+=' mine';
    return `<td class="${c}">${v.replace('・','・<wbr>').replace('オール','<wbr>オール')}${lim?`<small class="sbf">${lim}</small>`:''}</td>`;}).join('')}</tr>`).join('');
  return `<div class="scroll"><table class="sbt"><tr><th>${d?'親':'子'}</th>${head}</tr>${rows}</table></div>`;
}
function sbTip(p,d){
  const row=pp=>SB_HANS[pp].map(h=>sbVal(pp,h,d)).join(' → ');
  if(p[0]==='m')return '5翻 満貫・6〜7翻 跳満・8〜10翻 倍満・11〜12翻 三倍満・13翻〜 役満。'+(d?'親は子の1.5倍':'子のロンは 8000・12000・16000・24000・32000');
  const t={tsumo:'ツモは翻数だけ見て「30符の表」',menron:'門前ロンは「40符の表」。4翻で満貫が確定',nakiron:'鳴いてロンは「30符の表」',
    pinT:'平和ツモは「20符の表」（平和＋ツモで2翻から）',pinR:'平和ロンは「30符の表」（鳴いてロンと同じ）',
    chiR:'七対子は「25符の表」（2翻から）。4翻でも満貫にならない',chiT:'七対子ツモは「25符の表」（3翻から）'}[p];

function sbDealerTip(p,h,ts){
  const k=sbVal(p,h,false),o=sbVal(p,h,true);
  return ts?`親のツモは、子がツモったときに<b>親が払う額</b>の「オール」（子 ${k} → 親 ${o}）`:`親のロンは子の約1.5倍（子 ${k} → 親 ${o}）。100点単位の切り上げで少しずれる所もある`;

// ---- 段階1〜4：表の暗記カード ----
function sbNewCard(){const card=sbPickCard(shibu.stage);const o=sbCardOpts(card);Q={type:'score',sb:'card',card,ans:o.ans,opts:o.opts,sel:null,done:false,t0:Date.now()};sbDrawCard();}

  const c=Q.card,P=SB_PAT[c.p],d=Q.done;

    <div class="qhead"><p class="prompt">何点？</p>${stHTML()}</div>
    <div class="felt"><div class="bigq"><span class="bq-who ${c.d?'em':''}">${c.d?'親':'子'}</span><span class="bq-pat">${P.n}</span><span class="bq-han">${c.h}<small>翻</small></span></div>${hint?`<p class="rnote">${hint}</p>`:''}</div>
<!--CTRL-->
    <p class="hint">${d?'表のどこを見ればよいかは解説で確認できます':'答えをタップすると、すぐ答え合わせします'}</p>
    <div class="pad c2">${Q.opts.map(o=>{let k='';if(d){if(o===Q.ans)k='ok';else if(o===Q.sel)k='ng';}

}
function sbCheckCard(){
  const c=Q.card;Q.done=true;Q.ok=Q.sel===Q.ans;
  sbWeight(c.id,Q.ok,Date.now()-Q.t0>7000);record(Q.ok);const msg=sbProgress(Q.ok);sbDrawCard();
  const P=SB_PAT[c.p];

     <div><h3>${sbFamName(c.p)}の表（${c.d?'親':'子'}）</h3>${sbTable(sbFam(c.p),c.d,{p:c.p,h:c.h,mine:Q.ok?null:Q.sel})}
     <p class="sub">青＝正解${Q.ok?'':'　赤枠＝あなたの答え'}</p></div>`);

// ---- 段階5・6：手牌から ----
const sbFuX=r=>r.fuLines.filter(f=>!/^副底|^門前ロン|^ツモ$|^副露の平和形/.test(f[0]));
function sbPatOf(ctx,r){if(r.chiitoi)return ctx.tsumo?'chiT':'chiR';if(r.pinfu)return ctx.tsumo?'pinT':'pinR';return ctx.tsumo?'tsumo':(r.menzen?'menron':'nakiron');}
const sbGroup=p=>/^pin/.test(p)?'pin':/^chi/.test(p)?'chi':p;
function sbGenHand(st){
  const want=st===5?pick([0,1,1,2]):null;
  for(let k=0;k<400;k++){
    const q=genScoreQ(rules,st===5?pick([2,3,3]):pick([1,2,2,3]));if(!q)continue;
    const p=sbPatOf(q.ctx,q.r);
    if(st===5){
      if(q.r.chiitoi||q.r.pinfu||q.r.han>4)continue;
      const s=Math.max(0,(q.r.fu-SB_PAT[p].fu)/10);
      if(want===2?s<2:s!==want)continue;
    }else if(q.r.han>7)continue;
    return{...q,p};

}
function riverFacts(){
  const inR=zeros();Q.river.forEach(x=>inR[x.t]=1);
  const out=[];
  for(let s=0;s<3;s++){
    const sj=[];
    for(let n=1;n<=9;n++){
      const t=s*9+n-1;if(inR[t])continue;
      const sides=[];if(n>=4)sides.push(n-3);if(n<=6)sides.push(n+3);
      if(sides.every(e=>inR[s*9+e-1]))sj.push(`${n}（${sides.join('・')}のスジ）`);
    }
    if(sj.length)out.push(`<li><b>${SUITN[s]}子</b>のスジで通る牌：${sj.join('、')}</li>`);
  }
  const kabe=[];for(let t=0;t<27;t++)if(Q.V[t]>=4)kabe.push(tLabel(t));
  out.push(`<li><b>4枚見えている牌（壁）</b>：${kabe.length?kabe.join('・'):'なし'}</li>`);
  const r=Q.riichiT;
  if(r<27){const m=r%9+1;const ps=[[m-2,m+1],[m-1,m+2]].filter(([a,b])=>a>=1&&b<=9).map(([a,b])=>`${a}-${b}`);
    out.push(`<li><b>宣言牌</b>は${tLabel(r)}。またぎスジ（${ps.join('・')}）は、${m}を含む3枚の形（${m-1}${m}${m}・${m}${m}${m+1}など）から切った場合に危ない</li>`);}
  else out.push(`<li><b>宣言牌</b>は字牌の${tLabel(r)}。字牌はまたぎスジのヒントにならない</li>`);
  const ura=[];Q.early.forEach(d=>{if(d>=27)return;const m=d%9+1;const ps=[];if(m-4>=1)ps.push(`${m-4}-${m-1}`);if(m+4<=9)ps.push(`${m+1}-${m+4}`);if(ps.length)ura.push(`${tLabel(d)}→${ps.join('・')}`);});
  out.push(`<li><b>序盤（6巡目まで）の数牌の切りと裏スジ</b>：${ura.length?ura.join('、'):'序盤は字牌ばかりでヒントなし'}</li>`);
  return out.join('');
}
function readBody(){
  const safe=Q.kind==='safe';const waitSet=new Set(Q.waits);
  const mx=Math.max(...Q.cands.map(t=>Q.infos[t].danger))||1;
  const order=Q.cands.slice().sort((a,b)=>safe?Q.infos[a].danger-Q.infos[b].danger:Q.infos[b].danger-Q.infos[a].danger);
  const rows=order.map(t=>{
    const f=Q.infos[t];const pct=Math.round(f.danger/mx*100);const hit=waitSet.has(t);
    const tags=[];
    if(t===Q.win)tags.push(`<span class="tag ok">${safe?'正解（一番安全）':'正解（当たり）'}</span>`);
    if(safe&&hit)tags.push('<span class="tag ng">当たり牌</span>');
    tags.push(`<span class="tag">${f.label}</span>`);
    if(t===Q.sel&&t!==Q.win)tags.push('<span class="tag miss">あなたの選択</span>');
    const shp=f.shapes.map(x=>`<li class="${x.ok?'pos':'neg'}"><b>${x.ok?'残る':'否定'}</b>${x.n}<span>${x.why}</span></li>`).join('');
    return `<div class="rd ${t===Q.win?'hit':''}">
      <div class="rd-top"><span class="rd-t">${tileHTML(t)}</span>${tags.join('')}<span class="bar" aria-label="危険度 ${pct}"><i style="width:${Math.max(pct,3)}%"></i></span></div>
      <ul class="why">${f.reasons.map(r=>`<li>${r}</li>`).join('')}</ul>
      <ul class="shp">${shp}</ul></div>`;
  }).join('');
  // 相手の手
  const winSplits=Q.waits.map(w=>{
    const info=waitShapes(Q.hand,w);let split='';
    if(info.example){const e=info.example;
      split=e.groups.map(g=>{const has=g.k==='shun'?(w>=g.t&&w<=g.t+2):g.t===w;return grp(groupTiles(g),g.k==='shun'?'順子':'刻子',has);}).join('')+grp([e.pair,e.pair],'雀頭',e.pair===w);}
    return `<div class="waitrow"><div class="top">${tileHTML(w,{cls:'win'})}<span class="tag">${info.shapes.map(s=>WAITNAME[s]).join('・')}</span>${Q.cands.includes(w)?'<span class="tag ng">候補の中にあった</span>':''}</div><div class="split">${split}</div></div>`;
  }).join('');
  const steps=[
    ['現物','河にある牌は立直後は当たらない（この問題の候補には入れていません）'],
    ['スジ','河の牌の3つ隣（1-4-7・2-5-8・3-6-9）は両面待ちに当たらない'],
    ['見えている枚数','壁（4枚見え）・ワンチャンス（3枚見え）・字牌の残り枚数で、作れない形を消す'],
    ['宣言牌と序盤の切り','宣言牌のまたぎスジ、序盤に切られた牌の裏スジは危険度が上がる']];
  const hits={1:/スジ）/,2:/壁|ワンチャンス|枚見え|見えている/,3:/またぎ|裏スジ/};
  const stepH=steps.map(([n,dsc],i)=>{
    let app='';
    if(i>0){const ts=Q.cands.filter(t=>Q.infos[t].reasons.some(r=>hits[i].test(r)));app=ts.length?`この問題では：${ts.map(tLabel).join('・')}`:'この問題では該当なし';}
    return `<li><b>${n}</b>${dsc}${app?`<span class="app">${app}</span>`:''}</li>`;}).join('');
  const sel=Q.infos[Q.sel];const win=Q.infos[Q.win];
  let concl;
  if(safe){
    concl=`<p>${tLabel(Q.win)}は「${win.label}」。残る当たり方は${win.shapes.filter(x=>x.ok).map(x=>x.n).join('・')||'なし'}だけで、候補の中で一番少なくなります。`
      +(Q.ok?'':` 選んだ${tLabel(Q.sel)}は「${sel.label}」で、${sel.shapes.filter(x=>x.ok).map(x=>x.n).join('・')}が残ります。`)
      +(waitSet.has(Q.sel)?` 実際に${tLabel(Q.sel)}は相手の待ちでした。`:'')+'</p>';
  }else{
    concl=`<p>${tLabel(Q.win)}は「${win.label}」で、${win.reasons.filter(r=>/またぎ|裏スジ|否定できない/.test(r)).join('。')||'両面待ちが否定できません'}。ほかの候補は${Q.cands.filter(t=>t!==Q.win).map(t=>`${tLabel(t)}（${Q.infos[t].label}）`).join('、')}で、両面待ちが消えるか減っています。</p>`;
  }
  return `<div><h3>結論</h3>${concl}</div>
    <div><h3>考え方の手順</h3><ol class="steps-ol">${stepH}</ol></div>
    <div><h3>候補ごとの読み（${safe?'上ほど安全':'上ほど危険'}）</h3><div class="rds">${rows}</div>
      <p class="sub">「残る」は相手がその形で待っている可能性が残る形、「否定」は河や見えている牌から消せる形です。バーは危険度の目安（候補内での比較）。</p></div>
    <div><h3>河から分かること</h3><ul class="facts">${riverFacts()}</ul></div>
    <div><h3>相手の手牌と待ち（宣言牌 ${tLabel(Q.riichiT)}）</h3><div class="split" style="--tw:22px"><div class="g">${tiles(toArr(Q.hand))}</div></div>${winSplits}</div>`;
}

// ===== 何切る =====
const SHAN=s=>s===0?'聴牌':s+'向聴';
function newKiru(){const q=genNanikiru(levels.kiru);Q={type:'kiru',...q,selI:null,done:false};drawKiru();}
function drawKiru(){
  const d=Q.done;const arr=toArr(Q.hand);const best=Q.res[0];
  const best0=best.s===0;
  render(`
    <div class="qhead"><p class="prompt">何を切る？</p>${stHTML()}</div>
    <p class="hint">${best0?'聴牌に取れる打牌のうち、<b>待ちの枚数が一番多い</b>ものを選びます。':`いまは<b>${best.s}向聴</b>。向聴数を戻さず、<b>受け入れが一番広い</b>打牌を選びます。`}</p>
    <div class="preview">${Q.selI!=null&&!d?`<span>切る牌</span>${tileHTML(arr[Q.selI])}`:d?`<span>あなたの打牌</span>${tileHTML(Q.sel)}`:'<span class="sub">下の手牌から切る牌をタップ</span>'}</div>
<!--CTRL-->
    <div class="felt"><div class="row" style="--n:14">${arr.map((t,i)=>{
      let m=Q.selI===i?'on':'';
      if(d){const r=Q.res.find(x=>x.t===t);const isB=r.s===best.s&&r.cnt===best.cnt;m=isB?'mk-ok':(Q.selI===i?'mk-ng':'');}
      return `<button class="pick ${m}" type="button" data-i="${i}" aria-label="${tLabel(t)}" ${d?'disabled':''}>${tileHTML(t)}</button>`;}).join('')}</div></div>
    <p class="hint">${d?'緑の枠が正解の打牌です。':'切る牌をタップすると持ち上がります。'}</p>`);
  if(!d){
    root.querySelectorAll('#ctrl .felt .pick').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;Q.selI=Q.selI===i?null:i;drawKiru();});
    const sel=Q.selI!=null?arr[Q.selI]:null;
    setGo(sel!=null?`${tLabel(sel)} を切る`:'切る牌をタップ',sel!=null,()=>{
      Q.sel=sel;Q.done=true;const mine=Q.res.find(x=>x.t===sel);Q.ok=mine.s===best.s&&mine.cnt===best.cnt;record(Q.ok);drawKiru();
      const bests=Q.res.filter(x=>x.s===best.s&&x.cnt===best.cnt).map(x=>tLabel(x.t));
      openEx(Q.ok,`正解は <b>${bests.join('・')}</b> 切り（${SHAN(best.s)}・${best.cnt}枚）`,kiruBody(),kiruPin());
    });
  }else setGo('次の問題',true,next);
}
function kiruPin(){
  const best=Q.res[0];
  return `<div class="row" style="--n:14">${toArr(Q.hand).map(t=>{const r=Q.res.find(x=>x.t===t);const isB=r.s===best.s&&r.cnt===best.cnt;
    return tileHTML(t,{cls:isB?'mk-ok':(t===Q.sel?'mk-ng2':'')});}).join('')}</div><p class="pincap">緑＝正解の打牌　赤＝あなたの打牌</p>`;
}
function kiruBody(){
  const best=Q.res[0];const mine=Q.res.find(x=>x.t===Q.sel);
  const rows=Q.res.map(x=>{
    const isB=x.s===best.s&&x.cnt===best.cnt;
    return `<tr class="${isB?'best':''} ${x.t===Q.sel?'mine':''}"><td style="--tw:22px">${tileHTML(x.t)}</td><td class="num">${SHAN(x.s)}</td><td class="num">${x.s===best.s?x.cnt+'枚':'—'}</td><td>${x.s===best.s?`<div class="uke">${tiles(x.uke)}</div>`:'<span class="sub">向聴が戻る</span>'}</td></tr>`;
  }).join('');
  return `${!Q.ok?`<p class="sub">${tLabel(mine.t)}切りは${mine.s>best.s?'向聴数が戻ってしまいます。':`受け入れ ${mine.cnt}枚で、正解より ${best.cnt-mine.cnt}枚少なくなります。`}</p>`:''}
    <div><h3>打牌ごとの受け入れ（緑＝最善、橙の線＝あなたの選択）</h3><div class="scroll"><table>
    <tr><th>打牌</th><th class="num">切った後</th><th class="num">受入</th><th>有効牌</th></tr>${rows}</table></div></div>
    <p class="sub">牌の効率だけで判定しています。役・打点・安全度は考えていません。</p>`;
}

// ===== おさらい・設定 =====

sheet.onclick=e=>{if(e.target===sheet)closeSheet();};

root.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

<script>
(() => {
const KEY = 'jantaku-v1', HKEY = 'jantaku-v1-hist', FKEY = 'jantaku-v1-future';
const WINDS = '東南西北', NUMK = ['一','二','三','四'], POS = ['手前','右','奥','左'];
const $ = s => document.querySelector(s);
const tableEl = $('#table'), sheetEl = $('#sheet'), toastEl = $('#toast');

/* ---------- state ----------
   Seats are table positions (0 手前, 1 右, 2 奥, 3 左). Players have fixed ids so records,
   chips and stats follow a person through seat changes: S.seats[pos] = player id.       */
const clone = o => JSON.parse(JSON.stringify(o));
const newStats = () => [0,1,2,3].map(() => ({hands:0, wins:0, dealins:0, riichi:0, winSum:0}));
function ruleDefaults(n){ return n === 4 ? {start:25000, ret:30000, uma:[20,10,-10,-20]} : {start:35000, ret:40000, uma:[15,0,-15]}; }
const DEF = {v:2, n:4, pl:[{name:'Aさん'},{name:'Bさん'},{name:'Cさん'},{name:'Dさん'}], seats:[0,1,2,3],
  ...ruleDefaults(4), tsumo:'loss', kiriage:true, wall3:4, empty:3, tobi:true, agariyame:true,
  chipOn:false, chipYen:100, yakiOn:false, yakiPt:10, topPt:0,
  kiche:0, records:[], rate:50, fee:0, feePayer:-1, unit:10, chips:[0,0,0,0]};
function freshGame(s){
  s.scores = Array(s.n).fill(s.start); s.kyoku = 0; s.honba = 0; s.kyotaku = 0;
  s.riichi = Array(s.n).fill(false); s.won = Array(s.n).fill(false); s.dice = null;
}
function initial(){ const s = clone(DEF); s.st = newStats(); freshGame(s); return s; }
function migrate(s){
  if (!s.v){
    s.pl = [0,1,2,3].map(i => ({name:(s.names && s.names[i]) || 'ABCD'[i] + 'さん'}));
    s.seats = [...Array(s.n).keys()]; s.kiriage = true; delete s.names; s.v = 2;
  }
  for (const k in DEF) if (s[k] == null) s[k] = clone(DEF[k]);
  if (!s.st) s.st = newStats();
  if (!s.won) s.won = Array(s.n).fill(false);
  return s;
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.scores) && s.scores.length === s.n){ if (!s.v){ localStorage.removeItem(HKEY); localStorage.removeItem(FKEY); } return migrate(s); }
  }catch(e){}
  return initial();
}
function loadList(k){ try{ const h = JSON.parse(localStorage.getItem(k)); if (Array.isArray(h)) return h; }catch(e){} return []; }
let S = load(), hist = loadList(HKEY), future = loadList(FKEY);
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(HKEY, JSON.stringify(hist)); localStorage.setItem(FKEY, JSON.stringify(future)); }catch(e){} }
function push(){ hist.push(JSON.stringify(S)); if (hist.length > 40) hist.shift(); future = []; }
function commit(){ save(); render(); }

// ui.mode: null | pick | pay{f,a,unit} | draw{t,ng,abort} | multi{l,wins}
const ui = {sheet:null, sheetPos:0, mode:null, flash:null, diffBase:null, arm:null, recTab:'table', setTab:'basic', editNames:false};
let diffTimer, armTimer, toastTimer;

/* ---------- helpers ---------- */
const fmt = n => n.toLocaleString('ja-JP');
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n));
const cls = n => n > 0 ? 'p' : n < 0 ? 'm' : '';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ceil100 = x => Math.ceil(x / 100) * 100;
const r1 = x => Math.round(x * 10) / 10;
const dealer = () => (S.kiche + S.kyoku) % S.n;
const windOf = i => WINDS[(i - dealer() + S.n) % S.n];
const roundLabel = () => WINDS[Math.floor(S.kyoku / S.n) % 4] + NUMK[S.kyoku % S.n] + '局';
// seat index (play order) -> physical position; three-player skips the empty side
const posList = (n = S.n, e = S.empty) => n === 4 ? [0,1,2,3] : [0,1,2,3].filter(p => p !== e);
const posOf = i => posList()[i];
const pid = pos => S.seats[pos];
const name = pos => S.pl[S.seats[pos]].name;
const pname = id => S.pl[id].name;
const pt1 = x => (x > 0 ? '+' : x < 0 ? '−' : '±') + Math.abs(x).toFixed(1);
const yen = x => (x > 0 ? '+' : x < 0 ? '−' : '±') + fmt(Math.abs(x));
const range = n => [...Array(n).keys()];

function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}
function flash(delta){
  if (ui.flash && Date.now() - ui.flash.t < 3000) delta = delta.map((v, i) => v + (ui.flash.delta[i] || 0));
  ui.flash = {delta, t:Date.now()};
  setTimeout(() => { if (ui.flash && Date.now() - ui.flash.t >= 3300){ ui.flash = null; render(); } }, 3400);
}
function arm(key){ ui.arm = key; clearTimeout(armTimer); armTimer = setTimeout(() => { ui.arm = null; render(); }, 3500); }

/* ---------- scoring ---------- */
function basePts(han, fu, yk){
  if (yk) return 8000 * yk;
  if (han >= 13) return 8000; if (han >= 11) return 6000; if (han >= 8) return 4000;
  if (han >= 6) return 3000; if (han >= 5) return 2000;
  if (S.kiriage && ((han === 4 && fu === 30) || (han === 3 && fu === 60))) return 2000;
  return Math.min(2000, fu * 2 ** (han + 2));
}
function limitName(han, yk, base){
  if (yk) return yk > 1 ? yk + '倍役満' : '役満';
  if (han >= 13) return '数え役満'; if (han >= 11) return '三倍満'; if (han >= 8) return '倍満';
  if (han >= 6) return '跳満'; if (base >= 2000) return '満貫'; return '';
}
// tsumo payments; three-player uses ツモ損 or splits the missing north share
function tsumoDelta(w, base, honba){
  const n = S.n, d = dealer(), wd = w === d, pc = ceil100(base), pd = ceil100(base * 2);
  const extra = (n === 3 && S.tsumo === 'split') ? ceil100((wd ? pd : pc) / 2) : 0;
  const delta = Array(n).fill(0);
  for (let i = 0; i < n; i++){ if (i === w) continue; const p = (wd || i === d ? pd : pc) + extra + honba * 100; delta[i] -= p; delta[w] += p; }
  return {delta, pc, pd, extra, wd};
}
function calcWin(W, noKyotaku){
  const n = S.n, d = dealer(), wd = W.w === d, base = basePts(W.han, W.fu, W.yk);
  const pao = W.yk && W.pao != null && W.pao !== W.w ? W.pao : null;
  let delta = Array(n).fill(0), text, value;
  if (W.how === 'ron'){
    const p = ceil100(base * (wd ? 6 : 4)), hb = S.honba * 100 * (n - 1);
    if (pao != null && pao !== W.l){ const half = ceil100(p / 2); delta[pao] -= half; delta[W.l] -= p - half + hb; }
    else delta[W.l] -= p + hb;
    delta[W.w] += p + hb; text = fmt(p); value = p;
  } else {
    const t = tsumoDelta(W.w, base, S.honba);
    const total = t.delta[W.w];
    value = total - S.honba * 100 * (n - 1);
    if (pao != null){ delta[pao] = -total; delta[W.w] = total; } else delta = t.delta;
    text = t.wd ? fmt(t.pd) + 'オール' : fmt(t.pc) + '・' + fmt(t.pd);
    if (t.extra) text += ' +' + fmt(t.extra);
  }
  if (!noKyotaku) delta[W.w] += S.kyotaku * 1000;
  return {delta, text, value, limit:limitName(W.han, W.yk, base), wd, pao};
}
function calcDraw(M){
  const n = S.n; let delta = Array(n).fill(0);
  if (M.abort) return delta;
  if (M.ng.some(Boolean)){
    // 流し満貫: mangan tsumo for each, no honba, no noten payments
    M.ng.forEach((on, i) => { if (on) tsumoDelta(i, 2000, 0).delta.forEach((v, k) => delta[k] += v); });
    return delta;
  }
  const t = M.t.filter(Boolean).length, total = n === 4 ? 3000 : 2000;
  if (t === 0 || t === n) return delta;
  M.t.forEach((on, i) => { delta[i] = on ? total / t : -total / (n - t); });
  return delta;
}
function calcPts(scores, kyotaku){
  const n = S.n, order = range(n).sort((a, b) => scores[b] - scores[a] || ((a - S.kiche + n) % n) - ((b - S.kiche + n) % n));
  const fin = scores.slice(); fin[order[0]] += kyotaku * 1000;
  const oka = (S.ret - S.start) * n / 1000, pts = Array(n).fill(0), rank = Array(n).fill(0);
  order.forEach((i, r) => { rank[i] = r + 1; pts[i] = r1((fin[i] - S.ret) / 1000 + (S.uma[r] || 0) + (r === 0 ? oka : 0)); });
  return {pts, rank, fin};
}
// final points for the current game (by seat), including top prize and yakitori
function gameResult(yaki){
  const n = S.n, r = calcPts(S.scores, S.kyotaku), pts = r.pts.slice(), top = r.rank.indexOf(1);
  if (S.topPt){ pts[top] += S.topPt; range(n).forEach(i => { if (i !== top) pts[i] -= S.topPt / (n - 1); }); }
  if (S.yakiOn && yaki){
    const ys = range(n).filter(i => yaki[i]), ns = range(n).filter(i => !yaki[i]);
    if (ys.length && ns.length){ ys.forEach(i => pts[i] -= S.yakiPt); ns.forEach(i => pts[i] += S.yakiPt * ys.length / ns.length); }
  }
  return {pts:pts.map(r1), rank:r.rank, fin:r.fin};
}
function totals(){
  const t = Array(S.n).fill(0); S.records.forEach(r => r.pts.forEach((p, i) => t[i] += p));
  return t.map(r1);
}
// money by player id: pt × rate, chips × price, venue fee split evenly
function settle(){
  const n = S.n, u = S.unit || 1, R = x => Math.round(x / u) * u, share = S.fee / n, tot = totals();
  const collector = S.feePayer === -2 ? tot.reduce((b, p, i) => p > tot[b] ? i : b, 0) : S.feePayer;
  const rows = tot.map((p, i) => {
    const win = p * S.rate, chip = S.chipOn ? S.chips[i] * S.chipYen : 0, fee = -share + (collector === i ? S.fee : 0);
    return {p, win:R(win), chip:R(chip), fee:R(fee), net:R(win + chip + fee)};
  });
  const bal = rows.map((r, i) => ({i, v:r.net})), cred = bal.filter(b => b.v > 0).sort((a, b) => b.v - a.v), debt = bal.filter(b => b.v < 0).sort((a, b) => a.v - b.v);
  const xfers = []; let ci = 0, di = 0;
  while (ci < cred.length && di < debt.length){
    const amt = Math.min(cred[ci].v, -debt[di].v);
    if (amt > 0) xfers.push({f:debt[di].i, t:cred[ci].i, a:amt});
    cred[ci].v -= amt; debt[di].v += amt;
    if (cred[ci].v <= 0) ci++; if (debt[di].v >= 0) di++;
  }
  return {rows, xfers, share:R(share), gap:rows.reduce((a, r) => a + r.net, 0), collector};
}

/* ---------- hand flow ---------- */
function endHand(renchan, isDraw){
  const n = S.n, wasOras = S.kyoku === 2 * n - 1;
  S.riichi = Array(n).fill(false); S.dice = null;
  S.seats.forEach(id => S.st[id].hands++);
  if (renchan) S.honba++; else { S.kyoku++; S.honba = isDraw ? S.honba + 1 : 0; }
  let reason = null;
  if (S.tobi && S.scores.some(x => x < 0)) reason = 'トビで終了です';
  else if (S.kyoku >= 2 * n) reason = '南場が終わりました';
  else if (S.agariyame && wasOras && renchan && calcPts(S.scores, 0).rank[dealer()] === 1) reason = 'オーラスで親がトップです（アガリ止め・テンパイ止め）';
  if (reason){ ui.end = reason; ui.yaki = S.won.map(w => !w); ui.sheet = 'end'; ui.sheetPos = 0; }
}
function recordGame(yaki){
  const n = S.n, g = gameResult(yaki), P = Array(n), R = Array(n), Y = Array(n);
  range(n).forEach(pos => { P[pid(pos)] = g.pts[pos]; R[pid(pos)] = g.rank[pos]; Y[pid(pos)] = !!(S.yakiOn && yaki && yaki[pos]); });
  S.records.push({pts:P, rank:R, yaki:Y, at:Date.now()}); freshGame(S);
}
function finalizeMulti(){
  const M = ui.mode, n = S.n;
  // 供託は放銃者から見て上家取り（一番近い和了者）
  const near = M.wins.slice().sort((a, b) => ((a - M.l + n) % n) - ((b - M.l + n) % n))[0];
  if (S.kyotaku){ S.scores[near] += S.kyotaku * 1000; S.kyotaku = 0; }
  ui.mode = null; endHand(M.wins.includes(dealer()), false); commit();
  toast(`${M.wins.length}人の和了 → ${roundLabel()} ${S.honba}本場`);
}

/* ---------- dice & wall ---------- */
function dieHTML(v){
  const P = {1:[[15,15]],2:[[8,8],[22,22]],3:[[8,8],[15,15],[22,22]],4:[[8,8],[22,8],[8,22],[22,22]],
    5:[[8,8],[22,8],[15,15],[8,22],[22,22]],6:[[8,8],[22,8],[8,15],[22,15],[8,22],[22,22]]}[v] || [];
  const col = v === 1 || v === 4 ? '#d9432f' : '#1b1b1b', r = v === 1 ? 4.6 : 2.7;
  return `<svg class="die" viewBox="0 0 30 30" aria-label="${v}"><rect x="1" y="1" width="28" height="28" rx="6" fill="#f7f2e4" stroke="#bfae84" stroke-width="1"/>${P.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`).join('')}</svg>`;
}
// physical position (0-3) of the wall to break; counts counter-clockwise from the dealer (1 = dealer)
function wallInfo(){
  if (!S.dice || ui.rolling) return null;
  const sum = S.dice[0] + S.dice[1], d = dealer();
  if (S.n === 3 && S.wall3 === 3){
    const off = (sum - 1) % 3, seat = (d + off) % 3;
    return {pos:posOf(seat), text:`<em>${['自（親）','下家','上家'][off]}</em>＝${esc(name(seat))}の山`};
  }
  const off = (sum - 1) % 4, pos = (posOf(d) + off) % 4, seat = posList().indexOf(pos);
  if (seat < 0) return {pos, text:'<em>空席</em>の山'};
  return {pos, text:`<em>${S.n === 4 ? ['自（親）','下家','対面','上家'][off] : off ? ['','右','対面','左'][off] : '自（親）'}</em>＝${esc(name(seat))}の山`};
}

/* ---------- table ---------- */
function seatHTML(i){
  const d = dealer(), isD = i === d, sc = S.scores[i], M = ui.mode, id = pid(i);
  const tile = `<div class="tile ${isD?'is-oya':''}">${windOf(i)}${isD?'<span class="oya">親</span>':''}</div>`;
  let dl = '';
  if (ui.flash && ui.flash.delta[i]){
    const v = ui.flash.delta[i];
    dl = `<div class="delta ${cls(v)}" style="animation-delay:-${Date.now() - ui.flash.t}ms">${sgn(v)}</div>`;
  }
  // payer: the face turns into an amount pad facing that player
  if (M && M.type === 'pay' && M.f === i){
    const chip = M.unit === 'chip';
    const adds = (chip ? [1,2,3,5,-1] : [100,300,500,1000,5000,10000,-100,-1000]).map(v => `<button data-act="pay-add" data-v="${v}">${v>0?'+':'−'}${fmt(Math.abs(v))}</button>`).join('');
    return `<div class="seat" data-pos="${posOf(i)}"><div class="face active">${tile}
      <div class="pad ${chip?'chipmode':''}"><div class="amt-l">${S.chipOn?`<button class="unit" data-act="pay-unit-t">${chip?'チップ':'点数'} ⇄</button>`:'<span>支払う</span>'}<b>${fmt(M.a)}</b><span>${chip?'枚':'点'}</span></div>
        <div class="pc">${adds}<button data-act="pay-clr">0</button></div></div>
      <div class="btns"><button class="fb" data-act="mode-x">取消</button></div>${dl}</div></div>`;
  }
  let badges = '';
  if (S.yakiOn && !S.won[i]) badges += '<span class="bdg y">焼き鳥</span>';
  if (S.chipOn) badges += `<span class="bdg c">チップ${S.chips[id] > 0 ? '+' : ''}${S.chips[id]}</span>`;
  let right = '';
  if (ui.diffBase != null && ui.diffBase < S.n && !M){
    right = i === ui.diffBase ? '<span class="diff b">基準</span>' : `<span class="diff ${cls(sc - S.scores[ui.diffBase])}">${sgn(sc - S.scores[ui.diffBase])}</span>`;
  } else if (sc < 0) right = '<span class="tobi">トビ</span>';
  else if (S.riichi[i] && M) right = '<span class="rflag">リーチ</span>';
  let act = '';
  if (!M){
    act = `<div class="btns"><button class="fb win" data-act="tsumo" data-i="${i}">ツモ</button>
      <button class="fb win" data-act="ron" data-i="${i}">ロン</button>
      <button class="fb rch ${S.riichi[i]?'on':''}" data-act="riichi" data-i="${i}"><span class="stick s1000"></span><span>リーチ</span></button></div>`;
  } else if (M.type === 'pay'){
    act = `<button class="tgt ${M.a?'':'dim'}" data-act="pay-to" data-i="${i}">受け取る<small>${M.a?`+${fmt(M.a)}${M.unit==='chip'?'枚':'点'}`:'金額待ち'}</small></button>`;
  } else if (M.type === 'pick'){
    act = `<button class="tgt" data-act="m-pay" data-i="${i}">支払う<small>この人が払う</small></button>`;
  } else if (M.type === 'draw'){
    act = `<div class="btns dr"><button class="tgt ${M.t[i]?'':'off'}" data-act="draw-t" data-i="${i}">${M.t[i]?'テンパイ':'ノーテン'}<small>タップで切替</small></button>
      <button class="fb ${M.ng[i]?'on':''}" data-act="draw-ng" data-i="${i}">流し満貫</button></div>`;
  } else if (M.type === 'multi'){
    if (i === M.l) act = '<div class="tgt off">放銃</div>';
    else if (M.wins.includes(i)) act = '<div class="tgt off">和了済</div>';
    else act = `<button class="tgt red" data-act="ron2" data-i="${i}">ロン<small>この人も和了</small></button>`;
  }
  return `<div class="seat" data-pos="${posOf(i)}"><div class="face ${isD?'dealer':''}">${tile}
    <div class="mid"><div class="nm-row"><span class="nm">${esc(name(i))}</span><span class="nr">${right}</span></div>${badges?`<div class="bdgs">${badges}</div>`:''}
      <button class="score ${sc<0?'neg':''}" data-act="diff" data-i="${i}" aria-label="${esc(name(i))}との点差を表示">${fmt(sc)}</button></div>
    ${act}${dl}</div></div>`;
}
function centerHTML(){
  const M = ui.mode, n = S.n;
  const ended = S.kyoku >= 2 * n || (S.tobi && S.scores.some(x => x < 0));
  const round = `<div class="round"><div class="rw">${roundLabel()}</div>
      <div class="meta"><span><i class="stick s100"></i><b>${S.honba}</b>本場</span><span><i class="stick s1000"></i>供託<b>${S.kyotaku}</b></span></div>
      ${!M && ended ? '<button class="tag gold" data-act="open" data-s="record">終局 → 記録する</button>' : !M && S.kyoku === 2 * n - 1 ? '<span class="tag">オーラス</span>' : ''}
    </div>`;
  const quit = '<div class="acts"><button class="act wide" data-act="mode-x">やめる</button></div>';
  if (M && M.type === 'pay') return `<div class="center">${round}
    <div class="mode-box"><b>${esc(name(M.f))} が支払い</b>自分の席で金額を入れ、受け取る人の席の「受け取る」をタップ</div>${quit}</div>`;
  if (M && M.type === 'pick') return `<div class="center">${round}
    <div class="mode-box"><b>点数移動</b>支払う人の席の「支払う」をタップ</div>${quit}</div>`;
  if (M && M.type === 'multi') return `<div class="center">${round}
    <div class="mode-box"><b>ダブロン入力中</b>放銃：${esc(name(M.l))}<br>他にロンした人の席で「ロン」をタップ</div>
    <div class="acts"><button class="act wide primary" data-act="multi-end">ロン入力を終える</button></div></div>`;
  if (M && M.type === 'draw'){
    const delta = calcDraw(M), dd = dealer();
    const next = M.abort ? '親続行・1本場追加' : (M.t[dd] || M.ng[dd]) ? '親続行（連荘）' : '親流れ → 次の局';
    return `<div class="center">${round}
      <div class="mode-box" style="text-align:left"><div class="mini-dl">${delta.map((v, i) => `<div><span>${esc(name(i))}</span><b class="${cls(v)}">${v?sgn(v):'±0'}</b></div>`).join('')}</div>
        <div style="margin-top:6px;text-align:center">${M.ng.some(Boolean)&&!M.abort?'流し満貫（罰符なし）<br>':''}${next}</div></div>
      <div class="acts"><button class="act wide primary" data-act="draw-ok">流局を確定</button>
        <button class="act ${M.abort?'on':''}" data-act="draw-abort">途中流局</button><button class="act" data-act="mode-x">やめる</button></div></div>`;
  }
  const v = ui.rolling ? ui.diceVal : S.dice, wi = wallInfo();
  let dice = '<span>サイコロを振る</span>';
  if (v){
    dice = `<span class="drow">${dieHTML(v[0])}${dieHTML(v[1])}<b>${v[0] + v[1]}</b>${wi ? `<span class="arrow" style="transform:rotate(${[180,90,0,-90][wi.pos]}deg)">▲</span>` : ''}</span>`;
    if (wi) dice += `<span class="dtxt">${wi.text}</span>`;
  }
  return `<div class="center">${round}
    <button class="dmini ${ui.rolling?'rolling':''}" data-act="dice-roll" aria-label="サイコロを振る">${dice}</button>
    <div class="acts">
      <button class="act" data-act="m-draw">流局</button>
      <button class="act" data-act="m-pick">点数移動</button>
      <button class="act" data-act="open" data-s="record">点数表</button>
      <button class="act" data-act="open" data-s="oya">親決め</button>
      <button class="act wide" data-act="drill">練習（牌理ドリル）</button>
    </div>
    ${v ? '' : '<div class="chint">ツモ・ロン・リーチは<br>各自の席のボタンから</div>'}

function renderTable(){
