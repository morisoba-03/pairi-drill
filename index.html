    <div class="sec"><div class="lbl">端数の丸め</div><div class="chips" style="grid-template-columns:repeat(3,1fr)">${[1,10,100].map(u => `<button class="chip ${S.unit===u?'on':''}" data-act="pay-unit" data-v="${u}">${u}円単位</button>`).join('')}</div></div>
    <div class="tblwrap fit"><table class="${S.chipOn?'sm':''}"><thead><tr><th>名前</th><th>合計pt</th><th>勝ち負け</th>${S.chipOn?'<th>チップ</th>':''}<th>場所代</th><th>収支</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="sec"><div class="lbl">支払い（記録済み ${S.records.length} 半荘分）${st.gap?`<span style="color:var(--bad)">・丸めの差 ${yen(st.gap)}円</span>`:''}</div><div class="xfer">${xf}</div></div>`;
}
function statsHTML(){
  const n = S.n, ids = range(n), recs = S.records, pct = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '−';
  const rk = id => recs.map(r => r.rank[id]).filter(Boolean);
  const rows = [
    ['半荘数', id => rk(id).length],
    ['平均順位', id => { const a = rk(id); return a.length ? (a.reduce((x, y) => x + y, 0) / a.length).toFixed(2) : '−'; }],
    ['トップ率', id => pct(rk(id).filter(x => x === 1).length, rk(id).length)],
    ['ラス率', id => pct(rk(id).filter(x => x === n).length, rk(id).length)],
    ['通算pt', id => pt1(totals()[id])],
    ['局数', id => S.st[id].hands],
    ['和了率', id => pct(S.st[id].wins, S.st[id].hands)],
    ['放銃率', id => pct(S.st[id].dealins, S.st[id].hands)],
    ['リーチ率', id => pct(S.st[id].riichi, S.st[id].hands)],
    ['平均打点', id => S.st[id].wins ? fmt(Math.round(S.st[id].winSum / S.st[id].wins / 100) * 100) : '−'],
  ];
  if (S.chipOn) rows.push(['チップ', id => (S.chips[id] > 0 ? '+' : '') + S.chips[id] + '枚']);
  return `<div class="tblwrap"><table class="sm"><thead><tr><th></th>${ids.map(id => `<th>${esc(pname(id))}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(([l, f]) => `<tr><td>${l}</td>${ids.map(id => `<td>${f(id)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="rules">局数・和了率などは対局中の局も含みます。「記録をすべて消去」で成績もリセットされます。</div>`;
}
function renderSheet(){
  if (!ui.sheet){ sheetEl.hidden = true; sheetEl.innerHTML = ''; return; }
  const scroll = sheetEl.querySelector('.sh-body')?.scrollTop || 0;
  const same = sheetEl.dataset.s === ui.sheet && !sheetEl.hidden;
  const pos = ui.sheetPos || 0, W = tableEl.clientWidth, H = tableEl.clientHeight, side = pos % 2 === 1;
  sheetEl.hidden = false; sheetEl.dataset.s = ui.sheet;
  sheetEl.style.width = (side ? H : W) + 'px'; sheetEl.style.height = (side ? W : H) + 'px';
  sheetEl.style.transform = `translate(-50%,-50%) rotate(${[0,-90,180,90][pos]}deg)`;
  sheetEl.style.animation = same ? 'none' : '';
  let title = TITLES[ui.sheet];
  if (ui.sheet === 'win'){ const W2 = ui.win; title = `${name(W2.w)} の${W2.how==='ron'?'ロン':'ツモ'}${W2.cont?`（${ui.mode.wins.length+1}人目）`:''}`; }
  sheetEl.innerHTML = `<div class="sh-head"><h2>${esc(title)}</h2><button class="x" data-act="close" aria-label="閉じる">✕</button></div><div class="sh-body">${SHEETS[ui.sheet]()}</div>`;
  sheetEl.querySelector('.sh-body').scrollTop = scroll;
}
function render(){ renderTable(); renderSheet(); }

function openSheet(s, pos=0, keepMode=false){
  ui.arm = null; ui.sheetPos = pos; if (!keepMode) ui.mode = null;
  if (s === 'oya') ui.oya = {sel:S.kiche, spin:false};
  if (s === 'seat') ui.seatSel = null;
  if (s === 'record') ui.yaki = S.won.map(w => !w);
  if (s === 'set') ui.set = {n:S.n, names:range(4).map(i => i < S.n ? name(i) : ''), start:S.start, ret:S.ret, uma:S.uma.slice(),
    tsumo:S.tsumo, kiriage:S.kiriage, wall3:S.wall3, empty:S.empty, tobi:S.tobi, agariyame:S.agariyame, chipOn:S.chipOn, chipYen:S.chipYen, yakiOn:S.yakiOn, yakiPt:S.yakiPt, topPt:S.topPt};
  ui.sheet = s; render();
}
function readSet(){
  const D = ui.set; if (!D) return;
  const num = (id, int) => { const e = document.getElementById(id); if (!e) return null; const v = int ? parseInt(e.value, 10) : parseFloat(e.value); return isNaN(v) ? null : v; };
  for (let i = 0; i < D.n; i++){ const e = document.getElementById('nm' + i); if (e) D.names[i] = e.value; }
  const st = num('st', 1), rt = num('rt', 1); if (st != null) D.start = st; if (rt != null) D.ret = rt;
  D.uma = D.uma.map((u, i) => { const v = num('uma' + i); return v == null ? u : v; });
  const cy = num('chipYen', 1), yp = num('yakiPt'), tp = num('topPt');
  if (cy != null) D.chipYen = Math.max(0, cy); if (yp != null) D.yakiPt = Math.max(0, yp); if (tp != null) D.topPt = Math.max(0, tp);
}
function swapSeats(a, b){
  for (const k of ['seats','scores','riichi','won']) [S[k][a], S[k][b]] = [S[k][b], S[k][a]];
}

/* ---------- 練習（牌理ドリル） ---------- */
const VKEY = 'jantaku-view', drillHost = $('#drill');
let drillApi = null;
function mirrorTheme(){ const t = document.documentElement.getAttribute('data-theme'); if (t) drillHost.setAttribute('data-theme', t); else drillHost.removeAttribute('data-theme'); }
function showDrill(on){
  try{ localStorage.setItem(VKEY, on ? 'drill' : 'table'); }catch(e){}
  if (on){
    if (!drillApi){
      const root = drillHost.attachShadow({mode:'open'});
      root.appendChild($('#drillTpl').content.cloneNode(true));
      mirrorTheme(); new MutationObserver(mirrorTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
      drillHost.hidden = false;
      drillApi = initDrill(root, {getKiriage:() => S.kiriage, setKiriage:v => { S.kiriage = v; save(); }, exit:() => showDrill(false)});
    } else drillApi.sync();
  }
  drillHost.hidden = !on; $('#app').hidden = on;
  if (!on) render();
}

/* ---------- actions ---------- */
let wakeLock = null;
async function requestWake(show){
  try{ wakeLock = await navigator.wakeLock.request('screen'); if (show) toast('画面を点灯したままにします'); }
  catch(e){ if (show) toast('この環境では画面の常時点灯を設定できません'); }
}
function openWin(w, how, l, cont){ ui.win = {w, how, l, han:0, fu:30, yk:0, pao:null, chips:0, multi:false, cont}; openSheet('win', posOf(w), cont); }

const ACT = {
  open: d => openSheet(d.s),
  close: () => { ui.sheet = null; ui.arm = null; render(); },
  undo: () => {
    if (!hist.length) return;
    future.push(JSON.stringify(S)); if (future.length > 40) future.shift();
    S = migrate(JSON.parse(hist.pop())); ui.sheet = null; ui.mode = null; ui.flash = null; save(); render(); toast('1つ前の状態に戻しました');
  },
  redo: () => {
    if (!future.length) return;
    hist.push(JSON.stringify(S)); if (hist.length > 40) hist.shift();
    S = migrate(JSON.parse(future.pop())); ui.sheet = null; ui.mode = null; ui.flash = null; save(); render(); toast('1つ先の状態に進めました');
  },
  diff: d => {
    if (ui.mode) return;
    const i = +d.i; ui.diffBase = ui.diffBase === i ? null : i; clearTimeout(diffTimer);
    diffTimer = setTimeout(() => { ui.diffBase = null; render(); }, 6000); render();
  },
  riichi: d => {
    const i = +d.i, st = S.st[pid(i)]; push();
    if (S.riichi[i]){ S.riichi[i] = false; S.scores[i] += 1000; S.kyotaku = Math.max(0, S.kyotaku - 1); st.riichi = Math.max(0, st.riichi - 1); }
    else { S.riichi[i] = true; S.scores[i] -= 1000; S.kyotaku++; st.riichi++; }
    commit();
  },
  'mode-x': () => { ui.mode = null; render(); },
  'm-pick': () => { ui.diffBase = null; ui.mode = {type:'pick'}; render(); },
  'm-pay': d => { ui.diffBase = null; ui.mode = {type:'pay', f:+d.i, a:0, unit:'pt'}; render(); },
  'm-draw': () => { ui.diffBase = null; ui.mode = {type:'draw', t:Array(S.n).fill(false), ng:Array(S.n).fill(false), abort:false}; render(); },
  tsumo: d => openWin(+d.i, 'tsumo', null, false),
  ron: d => openWin(+d.i, 'ron', null, false),
  ron2: d => openWin(+d.i, 'ron', ui.mode.l, true),
  'multi-end': () => { push(); finalizeMulti(); },
  'win-l': d => { ui.win.l = +d.i; if (ui.win.pao === ui.win.l) ui.win.pao = null; render(); },
  'win-han': d => { Object.assign(ui.win, {han:+d.v, yk:0, pao:null}); render(); },
  'win-yk': d => { Object.assign(ui.win, {yk:+d.v, han:13}); render(); },
  'win-fu': d => { ui.win.fu = +d.v; render(); },
  'win-pao': d => { ui.win.pao = +d.i < 0 ? null : +d.i; render(); },
  'win-multi': () => { ui.win.multi = !ui.win.multi; render(); },
  'win-chip': d => { ui.win.chips = Math.max(0, ui.win.chips + +d.v); render(); },
  'win-ok': () => {
    const W = ui.win; if (!winValid(W)) return;
    const n = S.n, multi = W.multi || W.cont, r = calcWin(W, multi), wid = pid(W.w); push();
    r.delta.forEach((v, i) => S.scores[i] += v);
    if (S.chipOn && W.chips){
      if (W.how === 'ron'){ S.chips[pid(W.l)] -= W.chips; S.chips[wid] += W.chips; }
      else range(n).forEach(i => { if (i !== W.w){ S.chips[pid(i)] -= W.chips; S.chips[wid] += W.chips; } });
    }
    S.won[W.w] = true; S.st[wid].wins++; S.st[wid].winSum += r.value;
    if (W.how === 'ron' && !W.cont) S.st[pid(W.l)].dealins++;
    ui.sheet = null; flash(r.delta);
    if (multi){
      ui.mode = {type:'multi', l:W.l, wins:W.cont ? [...ui.mode.wins, W.w] : [W.w]};
      if (n - 1 - ui.mode.wins.length <= 0) return finalizeMulti();
      commit(); toast('次の和了者の席で「ロン」をタップ'); return;
    }
    S.kyotaku = 0; endHand(r.wd, false); commit();
    toast(`${name(W.w)} ${W.how==='ron'?'ロン':'ツモ'} ${r.limit || r.text}　→ ${roundLabel()} ${S.honba}本場`);
  },
  'pay-add': d => { ui.mode.a = Math.max(0, ui.mode.a + +d.v); render(); },
  'pay-clr': () => { ui.mode.a = 0; render(); },
  'pay-unit-t': () => { ui.mode.unit = ui.mode.unit === 'chip' ? 'pt' : 'chip'; ui.mode.a = 0; render(); },
  'pay-to': d => {
    const M = ui.mode, t = +d.i;
    if (!M.a){ toast(`${name(M.f)} の席で金額を入れてください`); return; }
    push();
    if (M.unit === 'chip'){ S.chips[pid(M.f)] -= M.a; S.chips[pid(t)] += M.a; ui.mode = null; commit(); toast(`${name(M.f)} → ${name(t)} チップ ${M.a}枚`); return; }
    const delta = Array(S.n).fill(0); delta[M.f] = -M.a; delta[t] = M.a;
    S.scores[M.f] -= M.a; S.scores[t] += M.a; ui.mode = null; flash(delta); commit();
    toast(`${name(M.f)} → ${name(t)} ${fmt(M.a)}点`);
  },
  'draw-t': d => { ui.mode.t[+d.i] = !ui.mode.t[+d.i]; render(); },
  'draw-ng': d => { ui.mode.ng[+d.i] = !ui.mode.ng[+d.i]; render(); },
  'draw-abort': () => { ui.mode.abort = !ui.mode.abort; render(); },
  'draw-ok': () => {
    const M = ui.mode, delta = calcDraw(M), dd = dealer(), ren = M.abort || M.t[dd] || M.ng[dd]; push();
    delta.forEach((v, i) => S.scores[i] += v);
    if (!M.abort) M.ng.forEach((on, i) => { if (on) S.won[i] = true; });
    ui.mode = null; flash(delta); endHand(ren, true); commit(); toast(`流局 → ${roundLabel()} ${S.honba}本場`);
  },
  'rec-tab': d => { ui.recTab = d.v; ui.arm = null; render(); },
  'edit-names': () => { ui.editNames = !ui.editNames; render(); },
  'yaki-t': d => { ui.yaki[+d.i] = !ui.yaki[+d.i]; render(); },
  'rec-add': () => {
    if (ui.arm !== 'rec-add'){ arm('rec-add'); return render(); }
    push(); recordGame(ui.yaki); ui.yaki = S.won.map(w => !w); ui.arm = null; commit();
    toast(`第${S.records.length}半荘を記録しました。次の半荘は東一局から`);
  },
  'end-rec': () => {
    push(); recordGame(ui.yaki); ui.sheet = null; commit();
    toast(`第${S.records.length}半荘を記録しました（席替えは「その他」から）`);
  },
  'rec-del': () => { if (ui.arm !== 'rec-del'){ arm('rec-del'); return render(); } push(); S.records.pop(); ui.arm = null; commit(); toast('最後の記録を削除しました'); },
  'rec-clr': () => { if (ui.arm !== 'rec-clr'){ arm('rec-clr'); return render(); } push(); S.records = []; S.st = newStats(); S.chips = [0,0,0,0]; ui.arm = null; commit(); toast('記録・成績・チップを消去しました'); },
  'pay-rate': d => { S.rate = +d.v; commit(); },
  'pay-payer': d => { S.feePayer = +d.i; commit(); },
  'pay-unit': d => { S.unit = +d.v; commit(); },
  'oya-sel': d => { ui.oya.sel = +d.i; render(); },
  'oya-rand': () => {
    const O = ui.oya; O.spin = true; const target = Math.floor(Math.random() * S.n); let k = 0; const steps = S.n * 3 + target + 1;
    const tick = () => { O.sel = k % S.n; render(); k++; if (k < steps) setTimeout(tick, 60 + k * 9); else { O.spin = false; O.sel = target; render(); } };
    tick();
  },
  'oya-ok': () => {
    const O = ui.oya; if (O.sel == null) return; push();
    S.kiche = O.sel; S.kyoku = 0; S.honba = 0; S.dice = null; ui.sheet = null; commit(); toast(`${name(S.kiche)} が起家（東一局の親）です`);
  },
  'seat-sel': d => {
    const i = +d.i;
    if (ui.seatSel == null){ ui.seatSel = i; return render(); }
    if (ui.seatSel === i){ ui.seatSel = null; return render(); }
    push(); swapSeats(ui.seatSel, i); ui.seatSel = null; commit();
  },
  'seat-rand': () => {
    push();
    for (let i = S.n - 1; i > 0; i--) swapSeats(i, Math.floor(Math.random() * (i + 1)));
    ui.seatSel = null; commit(); toast('席替えしました');
  },
  'dice-roll': () => {
    if (ui.rolling || ui.mode) return; ui.rolling = true; ui.diffBase = null; let k = 0;
    const roll = () => [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
    const tick = () => { ui.diceVal = roll(); render(); if (++k < 9) setTimeout(tick, 70); else { ui.rolling = false; S.dice = ui.diceVal; commit(); } };
    tick();
  },
  adj: d => {
    const k = d.k, v = +d.v; if (S[k] + v < 0) return; push(); S[k] += v;
    if (k === 'kyoku'){ S.riichi = Array(S.n).fill(false); S.dice = null; }
    commit();
  },
  wake: () => requestWake(true),
  drill: () => { ui.mode = null; ui.sheet = null; showDrill(true); },
  newgame: () => {
    if (ui.arm !== 'newgame'){ arm('newgame'); return render(); }
    push(); freshGame(S); ui.arm = null; ui.sheet = null; commit(); toast(`全員 ${fmt(S.start)} 点・東一局から開始`);
  },
  'set-tab': d => { ui.setTab = d.v; render(); },
  'set-n': d => {
    const D = ui.set, n = +d.v; if (D.n === n) return;
    D.n = n; Object.assign(D, ruleDefaults(n)); render();
  },
  'set-uma': d => {
    const p = d.v.split(',').map(Number), n = ui.set.n;
    ui.set.uma = n === 4 ? [p[1], p[0], -p[0], -p[1]] : [p[0], 0, -p[0]]; render();
  },
  'set-ts': d => { ui.set.tsumo = d.v; render(); },
  'set-kr': d => { ui.set.kiriage = d.v === '1'; render(); },
  'set-w3': d => { ui.set.wall3 = +d.v; render(); },
  'set-empty': d => { ui.set.empty = +d.v; render(); },
  'set-tobi': d => { ui.set.tobi = d.v === '1'; render(); },
  'set-ay': d => { ui.set.agariyame = d.v === '1'; render(); },
  'set-chip': d => { ui.set.chipOn = d.v === '1'; render(); },
  'set-yaki': d => { ui.set.yakiOn = d.v === '1'; render(); },
  'set-save': () => {
    const D = ui.set, nChg = D.n !== S.n;
    if (nChg && ui.arm !== 'set-save'){ arm('set-save'); return render(); }
    const pristine = S.kyoku === 0 && S.honba === 0 && S.kyotaku === 0 && S.scores.every(x => x === S.start);
    push();
    Object.assign(S, {n:D.n, start:D.start, ret:D.ret, uma:D.uma.slice(0, D.n), tsumo:D.tsumo, kiriage:D.kiriage, wall3:D.wall3, empty:D.empty, tobi:D.tobi,
      agariyame:D.agariyame, chipOn:D.chipOn, chipYen:D.chipYen, yakiOn:D.yakiOn, yakiPt:D.yakiPt, topPt:D.topPt});
    if (nChg){ S.seats = range(D.n); S.records = []; S.kiche = 0; S.feePayer = -1; S.chips = [0,0,0,0]; S.st = newStats(); }
    if (nChg || pristine) freshGame(S);
    range(S.n).forEach(i => { S.pl[pid(i)].name = String(D.names[i] || '').trim() || 'ABCD'[pid(i)] + 'さん'; });
    ui.sheet = null; ui.arm = null; commit(); toast('設定を保存しました');
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (ui.sheet === 'set') readSet();
  const f = ACT[b.dataset.act]; if (f) f(b.dataset);
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'rate' || id === 'fee'){ const v = parseInt(e.target.value, 10); S[id] = isNaN(v) || v < 0 ? 0 : v; commit(); return; }
  const m = /^pn(\d)$/.exec(id);
  if (m){ const v = e.target.value.trim(); if (v){ S.pl[+m[1]].name = v; save(); renderTable(); } }
});
document.addEventListener('pointerdown', () => { if (!wakeLock) requestWake(false); }, {once:true});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeLock) requestWake(false); });

/* ---------- layout ---------- */
function layout(){
  const W = tableEl.clientWidth, H = tableEl.clientHeight;
  const band = Math.round(Math.min(H * 0.2, W * 0.42));
  const side = Math.round(Math.min(W * 0.25, H * 0.16));
  const r = document.documentElement.style;
  r.setProperty('--band', band + 'px'); r.setProperty('--side', side + 'px'); r.setProperty('--mid', (H - 2 * band) + 'px');
  if (ui.sheet) renderSheet();
}
new ResizeObserver(layout).observe(tableEl);
layout(); render();
try{ if (localStorage.getItem(VKEY) === 'drill') showDrill(true); }catch(e){}
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}</script>
